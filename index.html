<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予実タイムライン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Meiryo UI','メイリオ',Meiryo,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:#1a1a1a;overflow:hidden;height:100vh;background:#f5f5f2;padding:12px}
.page{display:none}.page.active{display:block}.page.active.flex-page{display:flex}
.btn{font-size:12px;padding:5px 12px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;cursor:pointer}
.btn:hover{background:#f0f0f0}
.btn-plan{background:#E6F1FB;color:#0C447C;border-color:#B5D4F4}
.btn-actual{background:#E1F5EE;color:#085041;border-color:#9FE1CB}
.btn-today{background:#FAEEDA;color:#633806;border-color:#FAC775;font-weight:500}
.btn-week{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;font-weight:500}
.nav-btn{font-size:15px;padding:3px 10px;border:0.5px solid #ccc;border-radius:6px;background:#fff;color:#1a1a1a;cursor:pointer;line-height:1.4}
.nav-btn:hover{background:#f0f0f0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat{background:#f0ede6;border-radius:8px;padding:8px 12px}
.stat-label{font-size:11px;color:#666;margin-bottom:2px}
.stat-value{font-size:16px;font-weight:500}
.pbar-wrap{height:4px;background:#ddd;border-radius:2px;overflow:hidden;margin-top:4px}
.pbar{height:100%;border-radius:2px;transition:width .3s,background .3s}
.legend{display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#666}
.leg-dot{width:12px;height:12px;border-radius:3px}
.save-indicator{font-size:11px;color:#999;padding:3px 8px;border-radius:4px}
.save-ok{color:#1D9E75;background:#E1F5EE}
.date-display{font-size:13px;padding:5px 10px;border:0.5px solid #ccc;border-radius:8px;min-width:110px;text-align:center;background:#fff}
.date-display.is-today{border-color:#FAC775;background:#FAEEDA;color:#633806;font-weight:500}
.daily-layout{display:grid;grid-template-columns:var(--sidebar-w,160px) 16px 1fr;gap:0;align-items:stretch;flex:1;min-height:0;overflow:hidden}
.sidebar{background:#fff;border:0.5px solid #ccc;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:150px}
.sidebar-head{padding:8px 10px;font-size:11px;font-weight:500;color:#666;background:#f5f5f2;border-bottom:0.5px solid #ddd;display:flex;align-items:center;justify-content:space-between}
.sidebar-list{padding:6px;overflow-y:auto;flex:1}
.tmpl-item{padding:6px 8px;margin-bottom:4px;border-radius:6px;background:#f5f5f2;border:0.5px solid #ddd;cursor:grab;font-size:11px;user-select:none;transition:background .15s}
.tmpl-item:hover{background:#eee}
.tmpl-item.dragging{opacity:0.4}
.tmpl-item-name{font-weight:500;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmpl-item-dur{font-size:10px;color:#888;margin-top:1px}
.tmpl-add-btn{width:100%;font-size:11px;padding:5px;border:0.5px dashed #ccc;border-radius:6px;background:none;color:#999;cursor:pointer;margin-top:4px}
.tmpl-add-btn:hover{background:#f5f5f2;color:#666}
.tl-outer{border:0.5px solid #ccc;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:#fff}
.tl-colhead{display:grid;grid-template-columns:44px 1fr 1fr;flex-shrink:0}
.tl-colhead-time{background:#f5f5f2;border-right:0.5px solid #ddd;padding:8px 4px}
.tl-colhead-plan{padding:8px;font-size:12px;font-weight:500;text-align:center;background:#2E4057;color:#fff;border-right:0.5px solid rgba(255,255,255,0.15)}
.tl-colhead-actual{padding:8px;font-size:12px;font-weight:500;text-align:center;background:#1e5050;color:#fff}
.tl-scroll{overflow-y:auto;height:var(--tl-h,400px);min-height:150px}
.tl-inner{display:grid;grid-template-columns:44px 1fr 1fr}
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:20;align-items:flex-start;justify-content:center;padding-top:80px}
.modal{background:#fff;border:0.5px solid #ccc;border-radius:12px;padding:16px;width:270px}
.modal h3{font-size:13px;font-weight:500;margin-bottom:12px}
.modal label{font-size:11px;color:#666;display:block;margin-bottom:2px;margin-top:8px}
.modal input[type=text],.modal input[type=time],.modal input[type=number]{width:100%;font-size:13px;padding:5px 8px;border:0.5px solid #ccc;border-radius:6px;background:#fff;color:#1a1a1a}
.modal input[type=number]::-webkit-inner-spin-button,.modal input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.modal input[type=number]{-moz-appearance:textfield}
.modal input:focus{outline:none;border-color:#378ADD}
.modal-btns{display:flex;gap:8px;margin-top:14px}
.modal-btns button{flex:1;font-size:12px;padding:6px;border-radius:6px;cursor:pointer;border:none}
.modal-save{background:#E6F1FB;color:#0C447C}
.modal-del{background:#FAECE7;color:#712B13}
.modal-cancel{background:#f0f0f0;color:#666}

.tmpl-cat-header{padding:6px 8px 4px;margin-top:6px;cursor:grab;display:flex;align-items:center;gap:4px;border-radius:4px;border-top:2px solid transparent;transition:border-color .15s;}
.tmpl-cat-header:hover{background:#eee;}
.tmpl-cat-arrow{font-size:10px;color:#888;width:10px;}
.tmpl-cat-name{font-size:11px;font-weight:600;color:#555;}

.sidebar-resizer{width:16px;cursor:col-resize;background:transparent;position:relative;z-index:10;display:flex;align-items:center;justify-content:center;transition:background .15s}
.sidebar-resizer::before{content:'';display:block;width:4px;height:60px;background:#bbb;border-radius:2px;transition:background .15s}
.sidebar-resizer:hover::before,.sidebar-resizer.dragging::before{background:#378ADD}

.tl-v-resizer{height:18px;cursor:ns-resize;background:#e8e4dc;border-top:1px solid #ccc;border-bottom:1px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;gap:3px}
.tl-v-resizer:hover,.tl-v-resizer.dragging{background:#B5D4F4}
.tl-v-resizer::before{content:'';display:block;width:60px;height:4px;background:#bbb;border-radius:2px}
.tl-v-resizer:hover::before,.tl-v-resizer.dragging::before{background:#378ADD}

/* カレンダーピッカー */
.cal-popup{display:none;position:fixed;z-index:50;background:#fff;border:0.5px solid #ccc;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.12);padding:12px;width:240px;user-select:none}
.cal-popup.open{display:block}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-title{font-size:13px;font-weight:500;color:#1a1a1a;cursor:pointer;padding:2px 6px;border-radius:4px}
.cal-title:hover{background:#f0f0f0}
.cal-nav{font-size:15px;padding:2px 8px;border:none;background:none;cursor:pointer;color:#666;border-radius:4px;line-height:1.4}
.cal-nav:hover{background:#f0f0f0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:10px;color:#999;text-align:center;padding:2px 0;font-weight:500}
.cal-day{font-size:12px;text-align:center;padding:4px 2px;border-radius:6px;cursor:pointer;color:#1a1a1a;line-height:1.4}
.cal-day:hover{background:#E6F1FB;color:#0C447C}
.cal-day.today{background:#FAEEDA;color:#633806;font-weight:600}
.cal-day.selected{background:#2E4057;color:#fff;font-weight:600}
.cal-day.other-month{color:#ccc}
.cal-day.holiday{color:#993C1D}
.cal-day.sat{color:#0C447C}
</style>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>

<!-- 日次ページ -->
<div class="page flex-page active" id="pageDaily" style="flex-direction:column;height:calc(100vh - 24px);overflow:hidden;padding-bottom:8px">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;flex-shrink:0">
  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <button class="nav-btn" onclick="changeDate(-1)">‹</button>
    <span id="dateDisplay" class="date-display" onclick="toggleCalPicker()" style="cursor:pointer" title="クリックでカレンダーを開く"></span>
    <button class="nav-btn" onclick="changeDate(1)">›</button>
    <span style="font-size:12px;color:#666" id="dayLabel"></span>
    <button class="btn btn-today" id="btnToday" onclick="goToday()">今日</button>
    <button class="btn" onclick="showDashboard()" style="background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;font-size:11px">📊</button>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
    <button class="btn btn-plan" onclick="openAdd('plan')">＋ 予定</button>
    <button class="btn btn-actual" onclick="openAdd('actual')">＋ 実績</button>
    <button class="btn btn-week" onclick="saveAndWeek()">週表示</button>
    <button class="btn btn-week" onclick="saveAndMonth()">月表示</button>
    <button class="btn" onclick="copyPlanToActual()">予定→実績</button>
    <button class="btn" onclick="resetToday()" style="color:#999;border-color:#ddd">今日リセット</button>
    <button class="btn" onclick="resetScale()" style="color:#999;border-color:#ddd" title="タイムラインの縮尺をデフォルトに戻す">縮尺リセット</button>
    <button class="btn" onclick="importData()" style="color:#085041;border-color:#9FE1CB">インポート</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="onImportFile(this)">
    <button class="btn" onclick="exportData()" style="color:#085041;border-color:#9FE1CB">エクスポート</button>
    <button class="btn" onclick="copyText()">出力</button>
  </div>
</div>

<div class="daily-layout" style="flex:1;overflow:hidden;min-height:0">
  <div class="sidebar" id="sidebar" style="height:100%">
    <div class="sidebar-head">
      <span>テンプレート</span>
      <button style="font-size:10px;padding:2px 6px;border:0.5px solid #ccc;border-radius:4px;background:#fff;cursor:pointer" onclick="openTmplEdit(null)">＋</button>
    </div>
    <div class="sidebar-list" id="tmplList"></div>
  </div>
  <div class="sidebar-resizer" id="sidebarResizer"></div>
  <div class="tl-outer" style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden">
    <div class="tl-colhead">
      <div class="tl-colhead-time"></div>
      <div class="tl-colhead-plan">予　定</div>
      <div class="tl-colhead-actual">実　績</div>
    </div>
    <div class="tl-scroll" id="tlScroll" style="flex:1;overflow-y:auto;height:auto">
      <div class="tl-inner" id="tlGrid" ondragover="onDragOver(event)"></div>
    </div>
    <div class="tl-v-resizer" id="tlVResizer" style="display:none"></div>
  </div>
</div>
<p style="font-size:10px;color:#999;margin-top:2px;text-align:right;flex-shrink:0">ブロックをクリックで編集・削除　／　テンプレをタイムラインにドラッグで追加</p>

<!-- 学習チェックエリア -->
<div id="learningCheckArea" style="margin-top:8px;background:#fff;border:0.5px solid #ccc;border-radius:12px;overflow:hidden;flex-shrink:0;display:none;max-height:200px">
  <div style="padding:10px 14px;background:#f5f5f2;border-bottom:0.5px solid #ddd;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:12px;font-weight:500;color:#666">📚 学習チェック</span>
      <span id="learningProgress" style="font-size:11px;color:#aaa"></span>
    </div>
    <div style="display:flex;gap:4px">
      <button onclick="toggleLearningCheckArea()" id="learningCheckToggleBtn" style="font-size:11px;padding:2px 8px;border:0.5px solid #ccc;border-radius:4px;background:#fff;color:#666;cursor:pointer">▲ 閉じる</button>
    </div>
  </div>
  <div id="learningCheckList" style="padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;max-height:160px;overflow-y:auto"></div>
</div>

<!-- 日記エリア -->
<div id="diaryArea" style="margin-top:8px;background:#fff;border:0.5px solid #ccc;border-radius:12px;overflow:hidden;flex-shrink:0">
  <div style="padding:10px 14px;background:#f5f5f2;border-bottom:0.5px solid #ddd;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:12px;font-weight:500;color:#666">📝 日記</span>
      <span id="diaryStatus" style="font-size:11px;color:#aaa"></span>
    </div>
    <button onclick="toggleDiaryArea()" id="diaryToggleBtn" style="font-size:11px;padding:2px 8px;border:0.5px solid #ccc;border-radius:4px;background:#fff;color:#666;cursor:pointer">▲ 閉じる</button>
  </div>
  <div id="diaryBody">
  <textarea id="diaryText"
    placeholder="今日の振り返り、気づき、メモなど..."
    style="width:100%;min-height:60px;padding:12px 14px;border:none;resize:vertical;font-size:13px;font-family:inherit;color:#1a1a1a;background:#fff;outline:none;line-height:1.7"
    oninput="onDiaryInput()"
  ></textarea>
  </div>
</div>
</div>

<!-- 週次ページ -->
<div class="page" id="pageWeek" style="zoom:0.9">
<div style="margin:0 8px">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
  <div style="display:flex;align-items:center;gap:6px">
    <button class="nav-btn" onclick="changeWeek(-1)">‹</button>
    <span id="weekTitle" class="date-display" style="min-width:160px;cursor:pointer" onclick="toggleCalPickerWeek()" title="クリックでカレンダーを開く"></span>
    <button class="nav-btn" onclick="changeWeek(1)">›</button>
    <button class="btn btn-today" id="btnThisWeek" onclick="goThisWeek()">今週</button>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-week" onclick="showMonthFromWeek()">月表示</button>
    <button class="btn btn-week" onclick="showDaily()">日次に戻る</button>
  </div>
</div>

<div style="border:0.5px solid #ccc;border-radius:12px;overflow:hidden;background:#fff">
  <div id="weekScrollArea" style="overflow-y:auto;-webkit-overflow-scrolling:touch">
      <div style="display:grid;grid-template-columns:36px repeat(7,1fr);position:sticky;top:0;z-index:2;background:#fff">
        <div style="background:#f5f5f2;border-right:0.5px solid #ddd;border-bottom:0.5px solid #ddd;padding:6px 2px"></div>
        <div id="weekDayHeaders" style="display:contents"></div>
      </div>
      <div id="weekGrid" style="display:grid;grid-template-columns:36px repeat(7,1fr)"></div>
  </div>
</div>
<p style="font-size:11px;color:#999;margin-top:6px;text-align:right">日付列をクリックするとその日の日次画面に移動します</p>

<!-- 週次学習チェックエリア -->
<div id="weekLearningArea" style="margin-top:12px;border:0.5px solid #ccc;border-radius:12px;overflow:hidden;background:#fff;display:none">
  <div style="padding:8px 14px;background:#f5f5f2;border-bottom:0.5px solid #ddd;font-size:12px;font-weight:500;color:#666;display:flex;align-items:center;gap:8px">
    📚 今週の学習チェック
    <span id="weekLearningTotal" style="font-size:11px;color:#085041;background:#E1F5EE;border-radius:4px;padding:2px 8px;display:none"></span>
  </div>
  <div id="weekLearning" style="display:grid;grid-template-columns:36px repeat(7,1fr)"></div>
</div>

<!-- 週次日記エリア -->
<div style="margin-top:12px;border:0.5px solid #ccc;border-radius:12px;overflow:hidden;background:#fff">
  <div style="padding:8px 14px;background:#f5f5f2;border-bottom:0.5px solid #ddd;font-size:12px;font-weight:500;color:#666">📝 今週の日記</div>
  <div id="weekDiary" style="display:grid;grid-template-columns:36px repeat(7,1fr)"></div>
</div>
</div>
</div>

<!-- 月次ページ -->
<div class="page" id="pageMonth">
<div style="margin:0 8px">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
  <div style="display:flex;align-items:center;gap:6px">
    <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
    <span id="monthTitle" class="date-display" style="min-width:120px;text-align:center"></span>
    <button class="nav-btn" onclick="changeMonth(1)">›</button>
    <button class="btn btn-today" id="btnThisMonth" onclick="goThisMonth()">今月</button>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-week" onclick="showDailyFromMonth()">日次へ</button>
    <button class="btn btn-week" onclick="showWeekFromMonth()">週表示へ</button>
  </div>
</div>

<!-- 月カレンダーグリッド -->
<div style="border:0.5px solid #ccc;border-radius:12px;overflow:hidden;background:#fff">
  <div style="display:grid;grid-template-columns:repeat(7,1fr);background:#2E4057">
    <div style="padding:6px;text-align:center;font-size:11px;font-weight:500;color:#e88;border-right:0.5px solid rgba(255,255,255,0.1)">日</div>
    <div style="padding:6px;text-align:center;font-size:11px;font-weight:500;color:#fff;border-right:0.5px solid rgba(255,255,255,0.1)">月</div>
    <div style="padding:6px;text-align:center;font-size:11px;font-weight:500;color:#fff;border-right:0.5px solid rgba(255,255,255,0.1)">火</div>
    <div style="padding:6px;text-align:center;font-size:11px;font-weight:500;color:#fff;border-right:0.5px solid rgba(255,255,255,0.1)">水</div>
    <div style="padding:6px;text-align:center;font-size:11px;font-weight:500;color:#fff;border-right:0.5px solid rgba(255,255,255,0.1)">木</div>
    <div style="padding:6px;text-align:center;font-size:11px;font-weight:500;color:#fff;border-right:0.5px solid rgba(255,255,255,0.1)">金</div>
    <div style="padding:6px;text-align:center;font-size:11px;font-weight:500;color:#88f">土</div>
  </div>
  <div id="monthGrid" style="display:grid;grid-template-columns:repeat(7,1fr)"></div>
</div>
<p style="font-size:11px;color:#999;margin-top:6px;text-align:right">日付をクリックするとその日の日次画面に移動します</p>

<!-- 月次学習チェック集計 -->
<div id="monthLearningArea" style="margin-top:12px;border:0.5px solid #ccc;border-radius:12px;overflow:hidden;background:#fff;display:none">
  <div style="padding:8px 14px;background:#f5f5f2;border-bottom:0.5px solid #ddd;font-size:12px;font-weight:500;color:#666;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    📚 今月の学習まとめ
    <span id="monthLearningTotal" style="font-size:11px;color:#085041;background:#E1F5EE;border-radius:4px;padding:2px 8px"></span>
  </div>
  <div id="monthLearningDetail" style="padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 24px"></div>
</div>

</div>
</div>

<!-- 重複アラートモーダル -->
<div id="overlapAlertBg" onclick="closeOverlapAlert()" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:30;align-items:center;justify-content:center">
  <div onclick="event.stopPropagation()" style="background:#fff;border-radius:12px;padding:20px 24px;max-width:320px;width:90%;box-shadow:0 4px 20px rgba(0,0,0,0.15)">
    <div style="font-size:13px;font-weight:500;color:#1a1a1a;margin-bottom:10px" id="overlapAlertTitle"></div>
    <div style="font-size:13px;color:#444;margin-bottom:14px;line-height:1.7" id="overlapAlertBody"></div>
    <div style="font-size:11px;color:#999;text-align:center">画面のどこかをクリックすると閉じます</div>
  </div>
</div>

<!-- タスク modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">タスクを追加</h3>
    <label>タスク名</label>
    <input type="text" id="mName" placeholder="例: 定例会議" tabindex="1">
    <label>開始時刻</label>
    <div style="display:flex;align-items:center;gap:4px">
      <input type="number" id="mStartH" min="0" max="23" placeholder="時" tabindex="2"
        style="width:60px;font-size:13px;padding:5px 8px;border:0.5px solid #ccc;border-radius:6px;text-align:center">
      <span style="font-size:14px;color:#666">:</span>
      <input type="number" id="mStartM" min="0" max="45" step="15" placeholder="分" tabindex="3"
        style="width:60px;font-size:13px;padding:5px 8px;border:0.5px solid #ccc;border-radius:6px;text-align:center">
    </div>
    <label>終了時刻<span style="font-size:10px;color:#999;margin-left:4px">（翌日の場合はそのまま翌日の時刻）</span></label>
    <div style="display:flex;align-items:center;gap:4px">
      <input type="number" id="mEndH" min="0" max="23" placeholder="時" tabindex="4"

// ---- 基本ユーティリティ ----
function toMin(t){if(!t||!t.includes(':'))return 0;const[h,m]=t.split(':').map(Number);return h*60+(m||0);}
function minToTime(m){m=((m%1440)+1440)%1440;return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;}
function toH(m){const h=Math.floor(m/60),mn=m%60;if(h===0)return `${mn}m`;return mn?`${h}h${mn}m`:`${h}h`;}
function dur(s,e){return Math.max(0,toMin(e)-toMin(s));}
function toPx(t,px){return Math.max(0,(toMin(t)-START_H*60)*px);}
function hPx(s,e,px){return Math.max(10,dur(s,e)*px);}
function snapMin(m){return Math.round(m/15)*15;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function mPlan(a,plist){return (plist||plans).find(p=>p.name===a.name)||null;}
function dColor(pl,a){
  if(!pl)return{bg:'#E1F5EE',fg:'#085041'};
  const d=dur(a.start,a.end)-dur(pl.start,pl.end);
  if(Math.abs(d)<=15)return{bg:'#E1F5EE',fg:'#085041'};
  return d>0?{bg:'#FAECE7',fg:'#712B13'}:{bg:'#EAF3DE',fg:'#27500A'};
}

// ---- 日またぎ ----
function isOvernight(s,e){
  if(!s||!e)return false;
  if(e==='00:00')return true; // 翌日0時ちょうども日またぎ
  return toMin(e)<=toMin(s);
}
function mkDateStr(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function dateStr(){return mkDateStr(cY,cM,cD);}
function nextDateStr(){const d=new Date(cY,cM-1,cD+1);return mkDateStr(d.getFullYear(),d.getMonth()+1,d.getDate());}
function prevDateStr(){const d=new Date(cY,cM-1,cD-1);return mkDateStr(d.getFullYear(),d.getMonth()+1,d.getDate());}

function saveCarryOver(col,item){
  const key='yojitsu:'+nextDateStr();
  let data={plans:[],actuals:[],nextId:200};
  try{const r=localStorage.getItem(key);if(r)data=JSON.parse(r);}catch(e){}
  const arr=col==='plan'?data.plans:data.actuals;
  const carryId='carry_'+item.id;
  const existing=arr.find(x=>x.carryId===carryId);
  if(existing){existing.end=item.end;existing.name=item.name;}
  else arr.push({id:data.nextId++,name:item.name,start:'00:00',end:item.end,carryId,carryFrom:dateStr()});
  if(col==='plan')data.plans=arr;else data.actuals=arr;
  try{localStorage.setItem(key,JSON.stringify(data));}catch(e){}
}
function removeCarryOver(col,itemId){
  const key='yojitsu:'+nextDateStr();
  let data={plans:[],actuals:[],nextId:200};
  try{const r=localStorage.getItem(key);if(r)data=JSON.parse(r);}catch(e){}
  const carryId='carry_'+itemId;
  if(col==='plan')data.plans=data.plans.filter(x=>x.carryId!==carryId);
  else data.actuals=data.actuals.filter(x=>x.carryId!==carryId);
  try{localStorage.setItem(key,JSON.stringify(data));}catch(e){}
}
function getCarryFromPrev(){
  const key='yojitsu:'+prevDateStr();
  const result={plans:[],actuals:[]};
  try{
    const r=localStorage.getItem(key);
    if(r){
      const data=JSON.parse(r);
      // carryIdがある＝前日の日またぎブロックのキャリーオーバー
      data.plans.filter(p=>p.carryId).forEach(p=>result.plans.push(p));
      data.actuals.filter(a=>a.carryId).forEach(a=>result.actuals.push(a));
    }
  }catch(e){}
  return result;
}

// ---- データ保存/読込 ----
function loadData(y,m,d){
  const key='yojitsu:'+(y?mkDateStr(y,m,d):dateStr());
  try{
    const raw=localStorage.getItem(key);
    if(raw){
      const data=JSON.parse(raw);
      data.plans=(data.plans||[]).filter(p=>!p.carryId);
      data.actuals=(data.actuals||[]).filter(a=>!a.carryId);
      if(!y){
        plans=data.plans;actuals=data.actuals;nextId=data.nextId||200;
        learningChecks=data.learningChecks||{};
        learningMemos=data.learningMemos||{};
        const ta=document.getElementById('diaryText');
        if(ta)ta.value=data.diary||'';
        setDiaryStatus('');
      }
      return data;
    }else{
      if(!y){
        plans=[];actuals=[];nextId=200;
        learningChecks={};
        learningMemos={};
        const ta=document.getElementById('diaryText');
        if(ta)ta.value='';
        setDiaryStatus('');
      }
      return null;
    }
  }catch(e){if(!y){plans=[];actuals=[];nextId=200;}return null;}
}

  const diary=document.getElementById('diaryText')?document.getElementById('diaryText').value:'';

function exportFilename(){
  // ★ダウンロードファイル名の設定（変更する場合はここだけ編集）
  const now=new Date();
  const mm=String(now.getMonth()+1).padStart(2,'0');
  const dd=String(now.getDate()).padStart(2,'0');
  const hh=String(now.getHours()).padStart(2,'0');
  const mi=String(now.getMinutes()).padStart(2,'0');
  return '予実管理表'+mm+dd+' '+hh+mi+'.json';
}

function exportData(){
  // 全yojitsu:日付キーを収集
  const days={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith('yojitsu:')&&k!=='yojitsu:templates'){
      try{days[k.replace('yojitsu:','')]=JSON.parse(localStorage.getItem(k));}catch(e){}
    }
  }
  const data={
    version:1,
    exportedAt:new Date().toISOString(),
    templates,
    days
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const reader=new FileReader();
  reader.onload=function(){
    const a=document.createElement('a');
    a.href=reader.result;
    a.download=exportFilename();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };
  reader.readAsDataURL(blob);
}

function importData(){
  document.getElementById('importFile').value='';

}

function onImportFile(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.version||!data.days){alert('ファイルの形式が正しくありません');return;}
      if(!confirm('インポートすると現在のデータに上書きされます。続けますか？\n（同じ日付のデータは上書き、それ以外の日付は保持されます）'))return;
      // テンプレートを上書き
      if(data.templates){
        templates=data.templates;
        saveTemplates();
        renderTemplates();
      }
      // 日付データを上書き（YYYYMMDDの形式の日付キーのみ処理）
      const datePattern=/^\d{4}-\d{2}-\d{2}$/;
      const dayEntries=Object.entries(data.days).filter(([date])=>datePattern.test(date));
      dayEntries.forEach(([date,dayData])=>{
        // localStorageに保存
        localStorage.setItem('yojitsu:'+date,JSON.stringify(dayData));
        // Firebaseに保存
        if(currentUid){
          db.ref('users/'+currentUid+'/days/'+date).set(dayData);
        }
      });
      // 今日のデータを再読み込み
      loadData();
      renderBlocks();updateStats();renderLearningChecks();
      alert('インポートが完了しました（'+dayEntries.length+'日分）');
    }catch(err){
      alert('読み込みに失敗しました：'+err.message);
    }
  };
  reader.readAsText(file);
}

// ---- 学習チェック ----
function getLearningItems(){
  return templates.filter(t=>(t.category||'')==='学習');
}
function getActualMinutesForName(name){
  // actualsの中でnameが一致するブロックの合計時間（分）を返す
  return actuals.filter(b=>(b.name||'').trim()===name.trim())
    .reduce((sum,b)=>{
      const d=toMin(b.end)-toMin(b.start);
      return sum+(d>0?d:0);
    },0);
}
function fmtMin(min){
  if(min<=0)return '';
  const h=Math.floor(min/60),m=min%60;
  return h>0?(m>0?`${h}h${m}m`:`${h}h`):`${m}m`;
}
function renderLearningChecks(){
  const items=getLearningItems();
  const area=document.getElementById('learningCheckArea');
  const list=document.getElementById('learningCheckList');
  const prog=document.getElementById('learningProgress');
  if(!area||!list)return;
  if(!items.length){area.style.display='none';return;}
  area.style.display='block';
  // 展開ボタンの表示更新
  const expandBtn=document.getElementById('learningCheckExpandBtn');
  if(expandBtn)expandBtn.textContent=learningCheckExpanded?'▼ 折りたたむ':'▲ 広げる';

  // 実績との自動マッチング
  let totalActualMin=0;
  const autoChecked={};
  items.forEach(t=>{
    const min=getActualMinutesForName(t.name);
    if(min>0){autoChecked[t.id]=min;totalActualMin+=min;}
  });

  // done数: 自動チェック OR 手動チェック
  const done=items.filter(t=>autoChecked[t.id]||learningChecks[t.id]).length;
  prog.textContent=`${done}/${items.length}`;

  list.innerHTML=items.map(t=>{
    const isAuto=!!autoChecked[t.id];
    const isManual=!!learningChecks[t.id];
    const checked=isAuto||isManual;
    const min=autoChecked[t.id]||0;
    const timeLabel=min>0?`<span style="font-size:11px;color:#3C3489;background:#EEEDFE;border-radius:4px;padding:1px 6px;margin-left:4px">${fmtMin(min)}</span>`:'';
    // タグ表示は廃止（履歴はサジェストから確認・削除可能）
    const bg=checked?'#E6F1FB':'#fff';
    const borderColor=checked?'#B5D4F4':'#ddd';
    return `<div style="background:${bg};border:0.5px solid ${borderColor};border-radius:8px;overflow:visible;min-width:160px;flex-shrink:0">
      <div style="padding:6px 10px;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" ${checked?'checked':''} ${isAuto?'disabled':''}
          onchange="toggleLearningCheck(${t.id},this.checked)"
          onclick="event.stopPropagation()"

function addMemoTag(tid,text){
  if(!text.trim())return;
  if(!learningMemos[tid])learningMemos[tid]=[];
  if(!learningMemos[tid].includes(text.trim()))learningMemos[tid].push(text.trim());
  if(!learningMemoHistory[tid])learningMemoHistory[tid]=[];
  if(!learningMemoHistory[tid].includes(text.trim()))learningMemoHistory[tid].unshift(text.trim());
  if(learningMemoHistory[tid].length>20)learningMemoHistory[tid]=learningMemoHistory[tid].slice(0,20);
  saveMemoHistory();
  saveData();
  renderLearningChecks();
}
function removeMemoTag(tid,text){
  if(!learningMemos[tid])return;
  learningMemos[tid]=learningMemos[tid].filter(m=>m!==text);
  saveData();

}
function editMemoTag(tid,text,el){
  // タグを削除して入力欄にテキストを入れる

    input.value=text;

  }
}
function removeMemoHistory(tid,text){
  if(!learningMemoHistory[tid])return;
  learningMemoHistory[tid]=learningMemoHistory[tid].filter(m=>m!==text);
  saveMemoHistory();
  renderLearningChecks();
}
function showMemoSuggest(tid,input){
  const val=input.value.trim();
  const hist=learningMemoHistory[tid]||[];
  const filtered=val?hist.filter(h=>h.toLowerCase().includes(val.toLowerCase())):hist;
  let suggest=document.getElementById('memoSuggest_'+tid);
  if(!suggest)return;
  let html='';
  filtered.slice(0,5).forEach(h=>{
    const hs=h.replace(/'/g,"\\'");
    // 選択→入力欄にテキストをセット（修正可能）。Enterで確定。
    html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 8px;font-size:11px;color:#444;cursor:pointer;border-top:0.5px solid #eee" onmousedown="event.preventDefault();selectMemoSuggest(${tid},'${hs}')"><span>${h}</span><span style="color:#ccc;font-size:10px;padding:0 4px" onmousedown="event.stopPropagation();event.preventDefault();removeMemoHistory(${tid},'${hs}')">✕</span></div>`;
  });
  if(val&&!(hist.includes(val))){
    const vs=val.replace(/'/g,"\\'");
    html+=`<div style="padding:5px 8px;font-size:11px;color:#1D9E75;cursor:pointer;border-top:0.5px solid #eee;display:flex;align-items:center;gap:4px" onmousedown="event.preventDefault();addMemoTag(${tid},'${vs}');document.getElementById('memoInput_${tid}').value='';hideMemoSuggest(${tid})"><span>＋</span><span>「${val}」を新規追加</span></div>`;
  }
  suggest.innerHTML=html;
  suggest.style.display=html?'block':'none';
}
function selectMemoSuggest(tid,text){
  // サジェストから選択→入力欄に入れて修正可能にする
  const input=document.getElementById('memoInput_'+tid);
  if(input){
    input.value=text;
    input.focus();
    // カーソルを末尾に
    const len=input.value.length;
    setTimeout(()=>input.setSelectionRange(len,len),0);
  }
  hideMemoSuggest(tid);
}

  const s=document.getElementById('memoSuggest_'+tid);
  if(s)s.style.display='none';
}

function onTmplSortDrop(e,toId){
  e.stopPropagation();e.preventDefault();
  document.querySelectorAll('.tmpl-item').forEach(el=>{el.style.borderColor='';el.style.borderTop='';});
  if(catDragName!==null){catDragName=null;return;} // カテゴリD&D中は無視
  const fromId=sortDragId;
  sortDragId=null;
  dragTmpl=null;
  if(!fromId||fromId===toId)return;
  const fromIdx=templates.findIndex(x=>x.id===fromId);
  const toEl=document.querySelector('.tmpl-item[data-tid="'+toId+'"]');
  const toCat=toEl?toEl.dataset.cat:'';
  const toIdx=templates.findIndex(x=>x.id===toId);
  if(fromIdx<0||toIdx<0)return;
  const[moved]=templates.splice(fromIdx,1);
  moved.category=toCat; // 移動先のカテゴリに変更
  templates.splice(toIdx,0,moved);
  saveTemplates();
  renderTemplates();
  renderLearningChecks();
}

function getDropInfo(e){
  const tlScroll=document.getElementById('tlScroll');
  const tlGrid=document.getElementById('tlGrid');
  const gridRect=tlGrid.getBoundingClientRect();
  // グリッド内のY座標（スクロール込み）
  const relY=(e.clientY - gridRect.top) + tlScroll.scrollTop;
  const dropMin=START_H*60+Math.round(relY/PX/15)*15;
  // カラム判定
  const relX=e.clientX-gridRect.left-44;
  const col=relX>((gridRect.width-44)/2)?'actual':'plan';
  return{dropMin,col};
}

function handleDrop(e){
  e.stopPropagation();
  if(!dragTmpl)return;
  pushUndo();
  const tlScroll=document.getElementById('tlScroll');
  const scrollRect=tlScroll.getBoundingClientRect();
  // tlScrollのtop基準にする（tlGridはスクロールで位置が変わるので使わない）
  const relY=(e.clientY - scrollRect.top) + tlScroll.scrollTop;
  const dropMin=START_H*60+Math.floor(relY/PX/15)*15;
  // カラム判定はtlGridのX位置で（幅は変わらないので問題なし）
  const gridRect=document.getElementById('tlGrid').getBoundingClientRect();
  const relX=e.clientX - gridRect.left - 44;
  const col=relX>((gridRect.width-44)/2)?'actual':'plan';
  const startMin=Math.max(START_H*60,Math.min(dropMin,END_H*60-1));
  const endMin=startMin+dragTmpl.dur;
  const arr=col==='plan'?plans:actuals;
  if(endMin>=END_H*60){
    // 日またぎ：翌日の終了時刻を計算
    const nextEnd=endMin===END_H*60?'00:00':minToTime(endMin-END_H*60);
    const item={id:nextId++,name:dragTmpl.name,start:minToTime(startMin),end:nextEnd};
    arr.push(item);saveCarryOver(col,item);
  }else{
    arr.push({id:nextId++,name:dragTmpl.name,start:minToTime(startMin),end:minToTime(endMin)});
  }
  dragTmpl=null;
  saveData();
  render();
}

let mouseDownGridRect=null;
let mouseDownBlockOffset=0; // ブロック内のクリック位置（上端からのpx）

function startInteract(e,mode,col,id){
  if(e.button!==0)return;
  e.stopPropagation();e.preventDefault();
  const item=(col==='plan'?plans:actuals).find(x=>x.id===id);
  if(!item)return;
  mouseDownY=e.clientY;
  mouseDownItem={col,id,mode};
  // mousedown時点でgridのrectを記録
  const grid=document.getElementById('tlGrid');
  mouseDownGridRect=grid?grid.getBoundingClientRect():null;
  // ブロック内のクリック位置オフセットを記録（moveモードのみ）
  if(mode==='move'){
    const blockTop=toPx(item.start,PX);
    const tlScroll=document.getElementById('tlScroll');
    const scrollRect=tlScroll.getBoundingClientRect();
    const absBlockTop=scrollRect.top+blockTop-tlScroll.scrollTop;
    mouseDownBlockOffset=e.clientY-absBlockTop;
  }else{
    mouseDownBlockOffset=0;
  }
  dragState={mode,col,id,startY:e.clientY,origStartMin:toMin(item.start),origEndMin:toMin(item.end)};
  document.body.style.userSelect='none';
  document.body.style.cursor=mode==='move'?'grabbing':'ns-resize';
}
document.addEventListener('mousemove',e=>{
  // 週スケール処理
  if(weekScaleState){
    const dy=e.clientY-weekScaleState.startY;
    const factor=Math.pow(2,dy/150);
    // 最小値：スクロールエリアに0〜24時が収まるpx
    const scrollArea=document.getElementById('weekScrollArea');
    const areaH=scrollArea?scrollArea.getBoundingClientRect().height:400;
    const wMin=Math.max(WPX_MIN, areaH*0.88/(END_H-START_H)/60);
    WPX=Math.max(wMin,Math.min(WPX_MAX,weekScaleState.startWPX*factor));
    reRenderWeekScale();
    // インジケーター表示
    let ind=document.getElementById('weekScaleInd');
    if(!ind){
      ind=document.createElement('div');
      ind.id='weekScaleInd';
      ind.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);color:#fff;font-size:11px;padding:4px 12px;border-radius:20px;z-index:100;pointer-events:none';
      document.body.appendChild(ind);
    }
    ind.textContent=`週表示 縮尺: ${WPX.toFixed(2)}px/分`;
    ind.style.display='block';
    return;
  }
  // scaleState処理（dragStateとは独立して動く）
  if(scaleState){
    const dy=e.clientY-scaleState.startY;
    const factor=Math.pow(2,dy/150);
    // 最小値：CSS変数--tl-hから実際の高さを取得
    const tlScroll=document.getElementById('tlScroll');
    const cssH=getComputedStyle(document.documentElement).getPropertyValue('--tl-h');
    const tlH=cssH?parseFloat(cssH):tlScroll?tlScroll.offsetHeight:400;
    const pMin=Math.max(PX_MIN, tlH/(END_H-START_H)/60);
    PX=Math.max(pMin,Math.min(PX_MAX,scaleState.startPX*factor));
    reRenderScale();
    const newScrollTop=scaleState.anchorMin*PX-scaleState.anchorScreenY;
    tlScroll.scrollTop=Math.max(0,newScrollTop);
    showScaleIndicator(PX);
    return; // scaleState中はブロック操作しない
  }
  if(!dragState)return;
  const{mode,col,id,startY,origStartMin,origEndMin}=dragState;
  const dMin=snapMin((e.clientY-startY)/PX);
  const arr=col==='plan'?plans:actuals;
  const item=arr.find(x=>x.id===id);
  if(!item)return;
  const MIN=START_H*60,MAX=END_H*60;
  // ドラッグ中の表示用時刻（itemは書き換えない）
  let dispStart=item.start,dispEnd=item.end;
  if(mode==='move'){
    const len=origEndMin-origStartMin;
    const s=clamp(origStartMin+dMin,MIN,MAX-len);
    dispStart=minToTime(s);dispEnd=minToTime(s+len);
  }else if(mode==='resizeBot'){
    dispEnd=minToTime(clamp(origEndMin+dMin,origStartMin+15,MAX));
  }else if(mode==='resizeTop'){
    dispStart=minToTime(clamp(origStartMin+dMin,MIN,origEndMin-15));
  }
  // item本体も更新（mouseup時に保存するため）
  item.start=dispStart;item.end=dispEnd;
  const el=document.querySelector(`[data-block][data-col="${col}"][data-id="${id}"]`);
  if(el){
    el.style.top=toPx(dispStart,PX)+'px';
    el.style.height=hPx(dispStart,dispEnd,PX)+'px';
    // バッジのみ更新（ブロック内テキストは触らない）
    let badge=el.querySelector('.resize-badge');
    if(!badge){
      badge=document.createElement('div');
      badge.className='resize-badge';
      badge.style.cssText='position:absolute;top:2px;right:4px;font-size:10px;font-weight:500;color:#fff;padding:1px 6px;border-radius:3px;pointer-events:none;z-index:100;white-space:nowrap;line-height:1.6;';
      el.appendChild(badge);
    }
    const newDur=toMin(dispEnd)-toMin(dispStart);
    const origDur=origEndMin-origStartMin;
    badge.style.background=newDur>=origDur?'#0C447C':'#e53935';
    badge.textContent=`${dispStart} 〜 ${dispEnd}`;
  }
  updateStats();
});
document.addEventListener('mouseup',e=>{
  // 週スケール終了
  if(weekScaleState){
    weekScaleState=null;
    document.body.style.cursor='';
    document.body.style.userSelect='';
    const ind=document.getElementById('weekScaleInd');
    if(ind)ind.style.display='none';
    try{localStorage.setItem('yojitsu:wpx',WPX.toFixed(2));}catch(e){}
    return;
  }
  // scaleState処理（リサイザーとは独立）
  if(scaleState){
    scaleState=null;
    if(!window._tlVDragging&&!window._sbDragging){
      document.body.style.cursor='';
      document.body.style.userSelect='';
    }
    try{localStorage.setItem('yojitsu:px',PX.toFixed(2));}catch(e){}
    hideScaleIndicator();
    return;
  }
  if(!dragState)return;
  const moved=Math.abs(e.clientY-mouseDownY);
  const mi=mouseDownItem;
  const ds=dragState;
  dragState=null;mouseDownItem=null;
  document.body.style.userSelect='';document.body.style.cursor='';

  // リサイズバッジを削除
  document.querySelectorAll('.resize-badge').forEach(b=>b.remove());

  // X座標で実績列かどうか判定（mousedown時点のrectを使用）
  const gridRect=mouseDownGridRect;
  mouseDownGridRect=null;
  let droppedOnActual=false;
  if(gridRect){
    const relX=e.clientX-gridRect.left-44;
    droppedOnActual=relX>((gridRect.width-44)/2);
  }

  if(moved<5&&mi&&mi.mode==='move'){
    // 実績ブロックのクリック → 必ず編集ダイアログ
    if(mi.col==='actual'){
      selectBlock(mi.col,mi.id);
      openEdit(mi.col,mi.id);
      return;
    }
    // 予定ブロックのクリック → 予定列内のみダイアログ
    if(!droppedOnActual){
      selectBlock(mi.col,mi.id);
      openEdit(mi.col,mi.id);
      return;
    }
    // 予定ブロックを実績列へクリック（移動量5px未満）→ 何もしない
    return;
  }

  if(ds&&ds.col==='plan'&&ds.mode==='move'){
    const item=plans.find(x=>x.id===ds.id);
    if(item){
      if(droppedOnActual){
        // 予定を元の位置に戻す
        item.start=minToTime(ds.origStartMin);
        item.end=minToTime(ds.origEndMin);
        // 実績列にドロップ位置でコピー（ブロック内クリック位置を補正）
        const dur_=ds.origEndMin-ds.origStartMin;
        const tlScroll=document.getElementById('tlScroll');
        const scrollRect=tlScroll.getBoundingClientRect();
        const relY=(e.clientY-mouseDownBlockOffset-scrollRect.top)+tlScroll.scrollTop;
        const dropMin=clamp(START_H*60+Math.round(relY/PX/15)*15,START_H*60,END_H*60-Math.max(dur_,15));
        const newStart=minToTime(dropMin),newEnd=minToTime(dropMin+dur_);
        const overlaps=checkActualOverlap(newStart,newEnd);
        if(overlaps.length>0){alertOverlap(overlaps,'actual');renderBlocks();return;}
        actuals.push({id:nextId++,name:item.name,start:newStart,end:newEnd});
      } else {
        // 予定列内での移動 → 重複チェック
        const overlaps=checkPlanOverlap(item.start,item.end,item.id);
        if(overlaps.length>0){
          item.start=minToTime(ds.origStartMin);
          item.end=minToTime(ds.origEndMin);
          alertOverlap(overlaps,'plan');
          renderBlocks();return;
        }
      }
    }
  }
  // 実績ブロックの移動・リサイズ後の重複チェック
  if(ds&&ds.col==='actual'){
    const item=actuals.find(x=>x.id===ds.id);
    if(item){
      const overlaps=checkActualOverlap(item.start,item.end,item.id);
      if(overlaps.length>0){
        item.start=minToTime(ds.origStartMin);
        item.end=minToTime(ds.origEndMin);
        alertOverlap(overlaps,'actual');
        renderBlocks();return;
      }
    }
  }
  // 予定ブロックのリサイズ後の重複チェック
  if(ds&&ds.col==='plan'&&ds.mode!=='move'){
    const item=plans.find(x=>x.id===ds.id);
    if(item){
      const overlaps=checkPlanOverlap(item.start,item.end,item.id);
      if(overlaps.length>0){
        item.start=minToTime(ds.origStartMin);
        item.end=minToTime(ds.origEndMin);
        alertOverlap(overlaps,'plan');
        renderBlocks();return;
      }
    }
  }
  pushUndo();
  saveData();
  renderBlocks();updateStats();renderLearningChecks();
});

// ---- タイムライン描画 ----
function makeGridLines(px){
  let s='';
  for(let h=START_H;h<=END_H;h++){
    const top=(h-START_H)*60*px;
    const isMajor=(h%6===0);
    let lineColor;
    if(h>=0&&h<6)        lineColor=isMajor?'#D0DAF0':'#ECF0FA';
    else if(h>=6&&h<12)  lineColor=isMajor?'#C0D8C4':'#E4F0E6';
    else if(h>=12&&h<18) lineColor=isMajor?'#F0DCBB':'#F8EFE0';
    else                 lineColor=isMajor?'#D8C8EE':'#EEE6F8';
    s+=`<div style="position:absolute;top:${top}px;left:0;right:0;border-top:${isMajor?'1px':'0.5px'} solid ${lineColor}"></div>`;
  }
  return s;
}

function makeBlock(item,col,bg,fg,border,badge,isCarry=false){
  const top=toPx(item.start,PX),h=hPx(item.start,item.end,PX);
  const el=document.createElement('div');
  el.setAttribute('data-block','1');
  el.setAttribute('data-col',col);
  el.setAttribute('data-id',item.id);
  Object.assign(el.style,{
    position:'absolute',top:top+'px',left:'4px',right:'4px',
    height:h+'px',background:isCarry?bg+'cc':bg,
    border:`${isCarry?'1.5px dashed':'0.5px solid'} ${border}`,
    borderRadius:'4px',overflow:'visible',padding:'0',
    cursor:isCarry?'default':'grab',boxSizing:'border-box',
    opacity:isCarry?'0.75':'1'
  });

  // 高さに応じてハンドルサイズを調整
  const handleH=h>=20?8:Math.floor(h/4);
  const bodyTop=h<36?0:handleH; // 小さい時は上下余白なし
  const bodyBot=h<36?0:handleH;

  // 上ハンドル
  const topH=document.createElement('div');
  Object.assign(topH.style,{position:'absolute',top:`-${handleH}px`,left:'0',right:'0',height:`${handleH*2}px`,cursor:'ns-resize',zIndex:'3'});
  if(!isCarry)topH.addEventListener('mousedown',e=>startInteract(e,'resizeTop',col,item.id));

  // 本体
  const body=document.createElement('div');
  const bodyPad=h<36?2:5;
  Object.assign(body.style,{
    position:'absolute',top:`${bodyTop}px`,left:'0',right:'0',
    bottom:`${bodyBot}px`,cursor:isCarry?'default':'grab',
    overflow:'hidden',padding:`0 ${bodyPad}px`
  });

  const innerH=h-bodyTop-bodyBot;
  const timeStr=`${item.start}〜${item.end}（${toH(dur(item.start,item.end))}）`;
  const carryLabel=isCarry?`<span style="font-size:9px;opacity:0.6"> 前日から</span>`:'';

  if(innerH>=36){
    // 十分な高さ：タスク名＋時刻2行
    body.innerHTML=`
      <div style="font-size:11px;font-weight:500;color:${fg};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4">${item.name}${badge?' '+badge:''}</div>
      <div class="block-time" style="font-size:10px;color:${fg};opacity:0.8;line-height:1.4">${timeStr}${carryLabel}</div>`;
  } else {
    // 小さい：名前＋時刻を横並び1行（フォント縮小）
    const fs=Math.max(7, Math.min(11, innerH-2));
    const lh=Math.max(innerH, fs);
    body.innerHTML=`<div style="display:flex;align-items:center;gap:3px;overflow:hidden;height:${lh}px">
      <span style="font-size:${fs}px;font-weight:600;color:${fg};white-space:nowrap;flex-shrink:0">${item.name}${badge?' '+badge:''}</span>
      <span style="font-size:${Math.max(6,fs-1)}px;color:${fg};opacity:0.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:0">${timeStr}</span>
    </div>`;
  }

  if(!isCarry){
    body.addEventListener('mousedown',e=>startInteract(e,'move',col,item.id));
  }

  // 下ハンドル
  const botH=document.createElement('div');
  Object.assign(botH.style,{position:'absolute',bottom:`-${handleH}px`,left:'0',right:'0',height:`${handleH*2}px`,cursor:'ns-resize',zIndex:'3'});
  const grip=document.createElement('div');
  Object.assign(grip.style,{position:'absolute',bottom:'1px',left:'50%',transform:'translateX(-50%)',width:'20px',height:'2px',borderRadius:'1px',background:fg,opacity:'0.35'});
  botH.appendChild(grip);
  if(!isCarry)botH.addEventListener('mousedown',e=>startInteract(e,'resizeBot',col,item.id));
  el.appendChild(topH);el.appendChild(body);el.appendChild(botH);
  return el;
}

function renderBlocks(){
  if(!planCol||!actualCol)return;
  planCol.querySelectorAll('[data-block]').forEach(n=>n.remove());
  actualCol.querySelectorAll('[data-block]').forEach(n=>n.remove());
  // 前日キャリーオーバー
  const carry=getCarryFromPrev();
  carry.plans.forEach(p=>{
    planCol.appendChild(makeBlock({...p,start:'00:00'},'plan','#E6F1FB','#0C447C','#B5D4F4','',true));
  });
  carry.actuals.forEach(a=>{
    const pl=mPlan(a);const{bg,fg}=dColor(pl,a);
    const border=bg==='#FAECE7'?'#F0997B':bg==='#EAF3DE'?'#97C459':'#5DCAA5';
    actualCol.appendChild(makeBlock({...a,start:'00:00'},'actual',bg,fg,border,'',true));
  });
  // 当日ブロック
  plans.forEach(p=>{
    const overnight=isOvernight(p.start,p.end);
    const badge=overnight?'<span style="font-size:9px;background:#B5D4F433;color:#0C447C;border-radius:2px;padding:0 3px">→翌日</span>':'';
    planCol.appendChild(makeBlock({...p,end:overnight?'24:00':p.end},'plan','#E6F1FB','#0C447C','#B5D4F4',badge));
  });
  actuals.forEach(a=>{
    const pl=mPlan(a);const{bg,fg}=dColor(pl,a);
    const border=bg==='#FAECE7'?'#F0997B':bg==='#EAF3DE'?'#97C459':'#5DCAA5';
    const overnight=isOvernight(a.start,a.end);
    let badge='';
    if(overnight)badge=`<span style="font-size:9px;background:${fg}33;color:${fg};border-radius:2px;padding:0 3px">→翌日</span>`;
    else if(pl){const d=dur(a.start,a.end)-dur(pl.start,pl.end);if(Math.abs(d)>=15)badge=`<span style="font-size:9px;background:${fg}33;color:${fg};border-radius:2px;padding:0 3px">${d>0?'+':''}${d}分</span>`;}
    actualCol.appendChild(makeBlock({...a,end:overnight?'24:00':a.end},'actual',bg,fg,border,badge));
  });
}

function render(){
  const totalPx=(END_H-START_H)*60*PX;
  const gl=makeGridLines(PX);
  const timeHTML=makeTimeHTML(PX);
  const grid=document.getElementById('tlGrid');
  grid.innerHTML='';

  const timeCol=document.createElement('div');
  timeCol.style.cssText=`position:relative;height:${totalPx}px;border-right:0.5px solid #ddd;background:#f5f5f2;cursor:ns-resize;user-select:none`;
  timeCol.title='↑ ↓ ドラッグでタイムラインを伸縮';
  timeCol.innerHTML=gl+timeHTML;
  timeCol.addEventListener('mousedown',onTimeColScaleStart);
  grid.appendChild(timeCol);

  planCol=document.createElement('div');
  planCol.style.cssText=`position:relative;height:${totalPx}px;border-right:0.5px solid #ddd`;
  planCol.innerHTML=gl;
  // D&Dイベントを各カラムにも設定（バブリング対策）
  planCol.addEventListener('dragover',e=>{if(!dragTmpl)return;e.preventDefault();e.dataTransfer.dropEffect='copy';});
  planCol.addEventListener('drop',e=>{e.preventDefault();if(!dragTmpl)return;handleDrop(e);});
  grid.appendChild(planCol);

  actualCol=document.createElement('div');
  actualCol.style.cssText=`position:relative;height:${totalPx}px`;

  actualCol.addEventListener('dragover',e=>{if(!dragTmpl)return;e.preventDefault();e.dataTransfer.dropEffect='copy';});
  actualCol.addEventListener('drop',e=>{e.preventDefault();if(!dragTmpl)return;handleDrop(e);});
  grid.appendChild(actualCol);

  // tlGrid全体にはdragoverのみ（dropはplanCol/actualColで処理）
  grid.ondragover=onDragOver;
  renderBlocks();
  // 初回のみ7時付近にスクロール（削除・編集後はスクロール位置を維持）
  if(!render._initialized){
    document.getElementById('tlScroll').scrollTop=Math.max(0,(7*60-30)*PX);
    render._initialized=true;
  }
  updateStats();
  renderNowLine();
}

// ---- 現在時刻線 ----
function renderNowLine(){
  const isToday=(cY===todayY&&cM===todayM&&cD===todayD);
  [planCol,actualCol].forEach((col,i)=>{
    if(!col)return;
    let line=col.querySelector('.now-line');
    if(!line){
      line=document.createElement('div');
      line.className='now-line';
      line.style.cssText='position:absolute;left:0;right:0;height:2px;background:#e53935;z-index:10;pointer-events:none;';
      // 予定列のみ時刻ラベルを表示
      if(i===0){
        const label=document.createElement('div');
        label.className='now-line-label';
        label.style.cssText='position:absolute;left:4px;top:-9px;background:#e53935;color:#fff;font-size:10px;font-weight:500;padding:1px 5px;border-radius:3px;white-space:nowrap;pointer-events:none;';
        line.appendChild(label);
      }
      col.appendChild(line);
    }
    if(!isToday){line.style.display='none';return;}
    const now=new Date();
    const nowMin=now.getHours()*60+now.getMinutes();
    const top=(nowMin-START_H*60)*PX;
    line.style.display='block';
    line.style.top=top+'px';
    // 時刻ラベルを更新
    const label=line.querySelector('.now-line-label');
    if(label){
      const hh=String(now.getHours()).padStart(2,'0');
      const mm=String(now.getMinutes()).padStart(2,'0');
      label.textContent=hh+':'+mm;
    }
  });
}

// ---- 時間軸ドラッグでスケール変更 ----
// PX = 1分あたりのpx数。小さくすると同じ枠に多くの時間が入る（広く見える）
let scaleState=null;
let weekScaleState=null;

function onWeekTimeColScaleStart(e){
  if(e.button!==0)return;
  e.preventDefault();e.stopPropagation();
  const scrollArea=document.getElementById('weekScrollArea');
  const rect=scrollArea.getBoundingClientRect();
  const relY=(e.clientY-rect.top)+scrollArea.scrollTop;
  const anchorMin=relY/WPX;
  const anchorScreenY=e.clientY-rect.top;
  weekScaleState={startY:e.clientY,startWPX:WPX,anchorMin,anchorScreenY};
  document.body.style.cursor='ns-resize';
  document.body.style.userSelect='none';
}

function onTimeColScaleStart(e){
  if(e.button!==0)return;
  if(dragState)return;
  e.preventDefault();e.stopPropagation();
  const tlScroll=document.getElementById('tlScroll');
  const rect=tlScroll.getBoundingClientRect();
  // マウス位置に対応する時刻（分）をアンカーとして記録
  const relY=(e.clientY-rect.top)+tlScroll.scrollTop;
  const anchorMin=relY/PX;
  const anchorScreenY=e.clientY-rect.top; // 画面内での相対Y（固定）
  scaleState={startY:e.clientY,startPX:PX,anchorMin,anchorScreenY};
  document.body.style.cursor='ns-resize';
  document.body.style.userSelect='none';
  showScaleIndicator(PX);
}


function reRenderWeekScale(){
  const totalPx=(END_H-START_H)*60*WPX;
  const gl=makeGridLines(WPX);
  const timeHTML=makeTimeHTML(WPX);
  // 時間軸列を更新
  const timeCol=document.getElementById('weekTimeCol');
  if(timeCol){
    timeCol.style.height=totalPx+'px';
    timeCol.innerHTML=gl+timeHTML;
  }
  // 各日セルの高さ・グリッドライン・ブロック位置を更新
  for(let i=0;i<7;i++){
    const cell=document.getElementById('weekDayCell'+i);
    if(!cell)continue;
    cell.style.height=totalPx+'px';
    // グリッドライン（title/onclick属性なしのdiv）を再生成
    Array.from(cell.children).forEach(c=>{
      if(!c.hasAttribute('title')&&!c.getAttribute('onclick'))c.remove();
    });
    cell.insertAdjacentHTML('afterbegin',gl);
    // ブロック位置をtitle属性から再計算
    Array.from(cell.querySelectorAll('[title]')).forEach(b=>{
      const m=(b.getAttribute('title')||'').match(/(\d{2}:\d{2})〜(\d{2}:\d{2})/);
      if(m){
        b.style.top=toPx(m[1],WPX)+'px';
        b.style.height=Math.max(2,hPx(m[1],m[2],WPX))+'px';
      }
    });
  }
  // スクロール位置を維持（アンカー分）
  const scrollArea=document.getElementById('weekScrollArea');
  if(scrollArea&&weekScaleState){
    scrollArea.scrollTop=Math.max(0,weekScaleState.anchorMin*WPX-weekScaleState.anchorScreenY);
  }
}

function reRenderScale(){
  const totalPx=(END_H-START_H)*60*PX;
  const gl=makeGridLines(PX);
  const timeHTML=makeTimeHTML(PX);
  const grid=document.getElementById('tlGrid');
  const cols=grid.children;
  if(cols[0]){
    cols[0].style.height=totalPx+'px';
    cols[0].innerHTML=gl+timeHTML;
  }
  if(cols[1]){cols[1].style.height=totalPx+'px';cols[1].innerHTML=gl;}
  if(cols[2]){cols[2].style.height=totalPx+'px';cols[2].innerHTML=gl;}
  planCol=cols[1]||planCol;
  actualCol=cols[2]||actualCol;
  renderBlocks();
}

// 時間ラベルHTML生成（PXに応じて文字サイズ・表示間隔を連動）
function makeTimeHTML(px){
  // px小さい→間引く。1時間あたりのpxが12以下なら2時間ごと、6以下なら3時間ごと
  const hourPx=px*60;
  const step=hourPx<10?3:hourPx<18?2:1; // 何時間おきにラベルを出すか
  let s='';
  for(let h=START_H;h<=END_H;h++){
    if(h!==0&&h!==24&&h%step!==0)continue; // 間引き
    const top=(h-START_H)*60*px;
    const label=h===24?'24:00':`${String(h).padStart(2,'0')}:00`;
    const isMid=(h===0||h===24),isMajor=(h%6===0);
    const labelTop=h===0?top+2:top-7;
    let timeColor;
    if(h>=0&&h<6)        timeColor=isMajor?'#3A5A9B':'#6B85B8';
    else if(h>=6&&h<12)  timeColor=isMajor?'#2E6B42':'#5A9A6E';
    else if(h>=12&&h<18) timeColor=isMajor?'#A05A18':'#C47E3A';
    else                 timeColor=isMajor?'#5E3A8A':'#8B60BB';
    if(isMid)timeColor='#111';
    // 文字サイズをPXに連動（最小8px〜最大12px）
    const fBase=isMid?12:isMajor?11:10;
    const fScale=Math.max(0.7,Math.min(1.1,px/2.0));
    const fs=Math.round(fBase*fScale);
    s+=`<div style="position:absolute;top:${labelTop}px;left:0;right:4px;text-align:right;font-size:${fs}px;font-weight:${isMid?'700':isMajor?'600':'500'};color:${timeColor}">${label}</div>`;
  }
  return s;
}

// ---- 実績重複チェック ----
function checkActualOverlap(start, end, excludeId=null){
  // 重複しているブロックを返す（excludeIdは編集中のブロック自身を除外）
  const sMin=toMin(start), eMin=toMin(end);
  return actuals.filter(a=>{
    if(excludeId!==null && a.id===excludeId) return false;
    const aS=toMin(a.start), aE=toMin(a.end);
    return sMin < aE && eMin > aS;
  });
}
function checkPlanOverlap(start, end, excludeId=null){
  const sMin=toMin(start), eMin=toMin(end);
  return plans.filter(p=>{
    if(excludeId!==null && p.id===excludeId) return false;
    const pS=toMin(p.start), pE=toMin(p.end);
    return sMin < pE && eMin > pS;
  });
}
function alertOverlap(overlaps, col='actual'){
  const label=col==='plan'?'予定':'実績';
  const msg=overlaps.map(a=>`・${a.name}（${a.start}〜${a.end}）`).join('<br>');
  document.getElementById('overlapAlertTitle').textContent=`以下の${label}と時間が重なっています`;
  document.getElementById('overlapAlertBody').innerHTML=msg+'<br><br>時間帯を調整してください。';
  document.getElementById('overlapAlertBg').style.display='flex';
}

}

function saveModal(){
  const name=document.getElementById('mName').value.trim();
  const start=getModalTime('mStartH','mStartM');
  const end=getModalTime('mEndH','mEndM');
  if(!name||!start||!end){alert('名前・開始・終了を入力してください');return;}
  const overnight=isOvernight(start,end);
  if(!overnight&&toMin(end)<=toMin(start)){alert('終了は開始より後にしてください');return;}
  pushUndo();

  // 重複チェック（予定・実績どちらも）
  const excludeId=modalMode==='edit'?modalEditId:null;
  if(modalCol==='actual'){
    const overlaps=checkActualOverlap(start,end,excludeId);
    if(overlaps.length>0){alertOverlap(overlaps,'actual');return;}
  } else {
    const overlaps=checkPlanOverlap(start,end,excludeId);
    if(overlaps.length>0){alertOverlap(overlaps,'plan');return;}
  }

  const arr=modalCol==='plan'?plans:actuals;
  if(modalMode==='add'){
    const item={id:nextId++,name,start,end};
    arr.push(item);
    if(overnight)saveCarryOver(modalCol,item);
  }else{
    const item=arr.find(x=>x.id===modalEditId);
    if(item){
      const was=isOvernight(item.start,item.end);

      item.name=name;item.start=start;item.end=end;
      if(overnight)saveCarryOver(modalCol,item);
      else if(was)removeCarryOver(modalCol,item.id);
    }
  }
  closeModal();clearSelect();saveData();render();renderLearningChecks();
}
function deleteModal(){
  pushUndo();
  const arr=modalCol==='plan'?plans:actuals;
  const item=arr.find(x=>x.id===modalEditId);
  if(item&&isOvernight(item.start,item.end))removeCarryOver(modalCol,item.id);
  if(modalCol==='plan')plans=plans.filter(x=>x.id!==modalEditId);
  else actuals=actuals.filter(x=>x.id!==modalEditId);
  closeModal();clearSelect();
  saveData();
  render();renderLearningChecks();
}

document.getElementById('modalBg').addEventListener('keydown',function(e){

  if((e.key==='Delete'||e.key==='Backspace')&&modalMode==='edit'){
    // テキスト入力中は除外
    if(document.activeElement.tagName==='INPUT')return;
    e.preventDefault();

});

// ---- 月次 ----
function isThisMonth(){return monthY===todayY&&monthM===todayM;}
function changeMonth(n){
  const d=new Date(monthY,monthM-1+n,1);
  monthY=d.getFullYear();monthM=d.getMonth()+1;
  renderMonth();
}
function goThisMonth(){
  monthY=todayY;monthM=todayM;
  renderMonth();
}
function renderMonth(){
  const titleEl=document.getElementById('monthTitle');
  titleEl.textContent=`${monthY}年${monthM}月`;
  titleEl.className='date-display'+(isThisMonth()?' is-today':'');
  const btn=document.getElementById('btnThisMonth');
  if(btn){btn.style.opacity=isThisMonth()?'0.35':'1';btn.style.pointerEvents=isThisMonth()?'none':'auto';}

  const firstDow=new Date(monthY,monthM-1,1).getDay();
  const lastDay=new Date(monthY,monthM,0).getDate();
  const cells=[];
  for(let i=0;i<firstDow;i++){
    const d=new Date(monthY,monthM-1,-firstDow+1+i);
    cells.push({y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate(),otherMonth:true});
  }
  for(let d=1;d<=lastDay;d++) cells.push({y:monthY,m:monthM,d,otherMonth:false});
  while(cells.length%7!==0){
    const nd=new Date(monthY,monthM,cells.length-lastDay-firstDow+1);
    cells.push({y:nd.getFullYear(),m:nd.getMonth()+1,d:nd.getDate(),otherMonth:true});
  }

  // Firebaseから当月分データを並行取得
  const targetCells=cells.filter(c=>!c.otherMonth);
  if(currentUid){
    const promises=targetCells.map(cell=>{
      const ds=mkDateStr(cell.y,cell.m,cell.d);
      return db.ref('users/'+currentUid+'/days/'+ds).once('value').then(snap=>{
        const data=snap.val();
        if(data){
          data.plans=(data.plans||[]).filter(p=>!p.carryId);
          data.actuals=(data.actuals||[]).filter(a=>!a.carryId);
          try{localStorage.setItem('yojitsu:'+ds,JSON.stringify(data));}catch(e){}
          return {ds,data};
        }
        try{const raw=localStorage.getItem('yojitsu:'+ds);if(raw){const d2=JSON.parse(raw);d2.plans=(d2.plans||[]).filter(p=>!p.carryId);d2.actuals=(d2.actuals||[]).filter(a=>!a.carryId);return{ds,data:d2};}}catch(e){}
        return {ds,data:{plans:[],actuals:[],learningChecks:{}}};
      });
    });
    Promise.all(promises).then(results=>{
      const cache={};
      results.forEach(({ds,data})=>{cache[ds]=data;});
      renderMonthWithCache(cells,cache);
    });
  }else{
    const cache={};
    targetCells.forEach(cell=>{
      const ds=mkDateStr(cell.y,cell.m,cell.d);
      cache[ds]=loadData(cell.y,cell.m,cell.d)||{plans:[],actuals:[],learningChecks:{}};
    });
    renderMonthWithCache(cells,cache);
  }
}

function renderMonthWithCache(cells,cache){
  const learningItems=getLearningItems();
  const monthItemMin={};
  let monthTotalMin=0;
  learningItems.forEach(t=>{monthItemMin[t.id]=0;});

  const gridHTML=cells.map((cell,ci)=>{
    const dow=ci%7;
    const isT=!cell.otherMonth&&cell.y===todayY&&cell.m===todayM&&cell.d===todayD;
    const isSun=dow===0,isSat=dow===6;
    const holiday=!cell.otherMonth?getHoliday(cell.y,cell.m,cell.d):null;
    const isRed=isSun||!!holiday;
    const isLastCol=dow===6;
    const isLastRow=ci>=cells.length-7;

    let planMin=0,actualMin=0,checks={},dayActuals=[];
    if(!cell.otherMonth){
      const ds=mkDateStr(cell.y,cell.m,cell.d);
      const data=cache[ds]||{plans:[],actuals:[],learningChecks:{}};
      planMin=data.plans.reduce((s,x)=>s+dur(x.start,x.end),0);
      actualMin=data.actuals.reduce((s,x)=>s+dur(x.start,x.end),0);
      checks=data.learningChecks||{};
      dayActuals=data.actuals||[];
      learningItems.forEach(t=>{
        const m=dayActuals.filter(b=>(b.name||'').trim()===t.name.trim())
          .reduce((s,b)=>{const dd=toMin(b.end)-toMin(b.start);return s+(dd>0?dd:0);},0);
        if(m>0){monthItemMin[t.id]+=m;monthTotalMin+=m;}
      });
    }

    const MAX_MIN=480;
    const pPct=Math.min(100,planMin/MAX_MIN*100).toFixed(1);
    const aPct=Math.min(100,actualMin/MAX_MIN*100).toFixed(1);

    const doneCount=learningItems.filter(t=>{
      const autoOk=dayActuals.filter(b=>(b.name||'').trim()===t.name.trim())
        .reduce((s,b)=>{const dd=toMin(b.end)-toMin(b.start);return s+(dd>0?dd:0);},0)>0;
      return autoOk||!!checks[t.id];
    }).length;
    const hasLearning=learningItems.length>0;

    const borderR=isLastCol?'':'border-right:0.5px solid #eee;';
    const borderB=isLastRow?'':'border-bottom:0.5px solid #eee;';
    const bg=isT?'#fffdf5':cell.otherMonth?'#fafafa':'#fff';
    const dateColor=cell.otherMonth?'#ccc':isRed?'#993C1D':isSat?'#0C447C':'#1a1a1a';
    const clickFn=cell.otherMonth?'':`jumpToDay(${cell.y},${cell.m},${cell.d})`;
    return `<div style="padding:6px 8px 8px;min-height:80px;background:${bg};${borderR}${borderB}${cell.otherMonth?'':'cursor:pointer'}"
      onclick="${clickFn}"
      onmouseover="${cell.otherMonth?'':` this.style.background='#f0f0f0'`}"
      onmouseout="this.style.background='${bg}'">
      <div style="font-size:12px;font-weight:${isT?'700':'500'};color:${dateColor};margin-bottom:4px">${cell.d}</div>
      ${!cell.otherMonth&&(planMin>0||actualMin>0)?`
      <div style="margin-bottom:3px">
        <div style="height:3px;background:#E6F1FB;border-radius:2px;margin-bottom:2px;overflow:hidden"><div style="height:100%;width:${pPct}%;background:#378ADD;border-radius:2px"></div></div>
        <div style="height:3px;background:#E1F5EE;border-radius:2px;overflow:hidden"><div style="height:100%;width:${aPct}%;background:#1D9E75;border-radius:2px"></div></div>
      </div>
      <div style="display:flex;gap:3px;flex-wrap:wrap">
        ${planMin>0?`<span style="font-size:9px;color:#0C447C;background:#E6F1FB;border-radius:3px;padding:0 4px">${fmtMin(planMin)}</span>`:''}
        ${actualMin>0?`<span style="font-size:9px;color:#085041;background:#E1F5EE;border-radius:3px;padding:0 4px">${fmtMin(actualMin)}</span>`:''}
      </div>`:''}
      ${hasLearning&&!cell.otherMonth&&doneCount>0?`<div style="margin-top:4px;font-size:9px;color:${doneCount===learningItems.length?'#1D9E75':'#bbb'}">📚 ${doneCount}/${learningItems.length}</div>`:''}
    </div>`;
  }).join('');

  document.getElementById('monthGrid').innerHTML=gridHTML;

  // 月次学習集計
  const area=document.getElementById('monthLearningArea');
  const detail=document.getElementById('monthLearningDetail');
  const totalEl=document.getElementById('monthLearningTotal');
  if(!learningItems.length){area.style.display='none';return;}
  area.style.display='block';
  totalEl.textContent=monthTotalMin>0?`月合計 ${fmtMin(monthTotalMin)}`:'記録なし';
  detail.innerHTML=learningItems.map(t=>{
    const min=monthItemMin[t.id];
    const pct=monthTotalMin>0?Math.min(100,min/monthTotalMin*100).toFixed(1):0;
    return `<div style="display:flex;flex-direction:column;gap:3px;min-width:120px;padding:8px 12px;background:#f5f5f2;border-radius:8px">
      <div style="font-size:12px;font-weight:500;color:#444">${t.name}</div>
      <div style="font-size:15px;font-weight:600;color:${min>0?'#3C3489':'#ccc'}">${min>0?fmtMin(min):'---'}</div>
      ${min>0?`<div style="height:4px;background:#ddd;border-radius:2px;overflow:hidden;margin-top:2px"><div style="height:100%;width:${pct}%;background:#3C3489;border-radius:2px"></div></div>`:''}
    </div>`;
  }).join('');
}

function isThisWeek(){

function updateWeekTodayBtn(){

function renderWeek(){
  updateWeekTodayBtn();
  const dates=Array.from({length:7},(_,i)=>{
    const d=new Date(weekSunDate.y,weekSunDate.m-1,weekSunDate.d+i);
    return{y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate(),dow:d.getDay()};
  });
  const sun=dates[0],sat=dates[6];
