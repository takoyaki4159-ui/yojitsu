  weekTitleEl.textContent=
    `${sun.y}/${String(sun.m).padStart(2,'0')}/${String(sun.d).padStart(2,'0')} 〜 ${String(sat.m).padStart(2,'0')}/${String(sat.d).padStart(2,'0')}`;
  weekTitleEl.className='date-display'+(isThisWeek()?' is-today':'');

  // Firebaseから7日分のデータを並行取得してから描画
  if(currentUid){
    const promises=dates.map(dt=>{
      const ds=mkDateStr(dt.y,dt.m,dt.d);
      return db.ref('users/'+currentUid+'/days/'+ds).once('value').then(snap=>{
        const data=snap.val();
        if(data){
          data.plans=(data.plans||[]).filter(p=>!p.carryId);
          data.actuals=(data.actuals||[]).filter(a=>!a.carryId);
          try{localStorage.setItem('yojitsu:'+ds,JSON.stringify(data));}catch(e){}
          return data;
        }
        // Firebaseになければlocalから
        try{const raw=localStorage.getItem('yojitsu:'+ds);if(raw){const d2=JSON.parse(raw);d2.plans=(d2.plans||[]).filter(p=>!p.carryId);d2.actuals=(d2.actuals||[]).filter(a=>!a.carryId);return d2;}}catch(e){}
        return {plans:[],actuals:[],learningChecks:{}};
      });
    });
    Promise.all(promises).then(weekData=>renderWeekWithData(dates,weekData));
  }else{
    const weekData=dates.map(dt=>loadData(dt.y,dt.m,dt.d)||{plans:[],actuals:[]});
    renderWeekWithData(dates,weekData);
  }
}

function renderWeekWithData(dates,weekData){
  document.getElementById('weekDayHeaders').innerHTML=dates.map((dt,i)=>{
    const isT=(dt.y===todayY&&dt.m===todayM&&dt.d===todayD);
    const isSun=dt.dow===0,isSat=dt.dow===6;
    const holiday=getHoliday(dt.y,dt.m,dt.d);
    const isRed=isSun||!!holiday;
    const data=weekData[i];
    const pT=data.plans.reduce((s,x)=>s+dur(x.start,x.end),0);
    const aT=data.actuals.reduce((s,x)=>s+dur(x.start,x.end),0);

    const holStr=holiday?`<div style="font-size:9px;color:#993C1D;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${holiday}</div>`:'';
    return `<div onclick="jumpToDay(${dt.y},${dt.m},${dt.d})" style="padding:6px 4px;text-align:center;border-bottom:0.5px solid #ddd;border-right:0.5px solid #ddd;font-size:11px;font-weight:500;background:${isT?'#FAEEDA':'transparent'};color:${isRed?'#993C1D':isSat?'#0C447C':'#1a1a1a'};cursor:pointer">
      <div>${DAYS[dt.dow]}</div><div style="font-size:10px;color:#999">${dt.m}/${dt.d}</div>${holStr}</div>`;
  }).join('');
  let totalP=0,totalA=0,overD=0;
  weekData.forEach(data=>{
    const p=data.plans.reduce((s,x)=>s+dur(x.start,x.end),0);
    const a=data.actuals.reduce((s,x)=>s+dur(x.start,x.end),0);
    totalP+=p;totalA+=a;if(a>p+15)overD++;
  });

  const totalPx=(END_H-START_H)*60*WPX;
  const gl=makeGridLines(WPX);
  const timeHTML=makeTimeHTML(WPX);
  let gridHTML=`<div id="weekTimeCol" style="position:relative;height:${totalPx}px;border-right:0.5px solid #ddd;background:#f5f5f2;cursor:ns-resize;user-select:none" title="ドラッグで縮尺変更">${gl}${timeHTML}</div>`;
  dates.forEach((dt,i)=>{
    const data=weekData[i];
    const isT=(dt.y===todayY&&dt.m===todayM&&dt.d===todayD);
    const isLast=i===6;
    let blocks='';
    data.plans.forEach(p=>{
      const top=toPx(p.start,WPX),h=hPx(p.start,p.end,WPX);
      blocks+=`<div onclick="jumpToDay(${dt.y},${dt.m},${dt.d})" title="${p.name} ${p.start}〜${p.end}" style="position:absolute;top:${top}px;left:1px;width:calc(50% - 2px);height:${h}px;background:#E6F1FB;border-radius:2px;overflow:hidden;padding:1px 2px;cursor:pointer">
        <div style="font-size:9px;color:#0C447C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div></div>`;
    });
    data.actuals.forEach(a=>{
      const top=toPx(a.start,WPX),h=hPx(a.start,a.end,WPX);
      const pl=mPlan(a,data.plans);const{bg,fg}=dColor(pl,a);
      blocks+=`<div onclick="jumpToDay(${dt.y},${dt.m},${dt.d})" title="${a.name} ${a.start}〜${a.end}" style="position:absolute;top:${top}px;right:1px;width:calc(50% - 2px);height:${h}px;background:${bg};border-radius:2px;overflow:hidden;padding:1px 2px;cursor:pointer">
        <div style="font-size:9px;color:${fg};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.name}</div></div>`;
    });
    gridHTML+=`<div id="weekDayCell${i}" style="position:relative;height:${totalPx}px;background:${isT?'#fffdf5':'#fff'};${isLast?'':'border-right:0.5px solid #ddd;'}">${gl}${blocks}</div>`;
  });
  document.getElementById('weekGrid').innerHTML=gridHTML;
  setTimeout(()=>{
    const scrollArea=document.getElementById('weekScrollArea');
    // 高さをタイムラインコンテンツに合わせる（ただし画面の60%を上限に）
    // scrollAreaの上端位置から画面下端まで、学習チェック・日記分を引いた高さ
    const areaTop=scrollArea.getBoundingClientRect().top;
    const LEARN_H=80;  // 学習チェックエリアの高さ
    const DIARY_H=120;  // 日記エリアの高さ
    const MARGIN=40;   // 余白
    const fixedH=Math.max(200, window.innerHeight - areaTop - LEARN_H - DIARY_H - MARGIN);
    scrollArea.style.height=fixedH+'px';
    // WPXを再計算してタイムラインをfixedHにぴったり合わせる
    WPX=fixedH/(END_H-START_H)/60;
    // グリッドを再描画
    const newTotalPx=(END_H-START_H)*60*WPX;
    const newGl=makeGridLines(WPX);
    const newTimeHTML=makeTimeHTML(WPX);
    document.getElementById('weekTimeCol').style.height=newTotalPx+'px';
    document.getElementById('weekTimeCol').innerHTML=newGl+newTimeHTML;
    for(let i=0;i<7;i++){
      const cell=document.getElementById('weekDayCell'+i);
      if(cell)cell.style.height=newTotalPx+'px';
    }
    const areaH=scrollArea.getBoundingClientRect().height;
    const minWPX=areaH*0.88/(END_H-START_H)/60;
    // 最小縮尺なら0時から表示、それ以外は7時付近
    if(WPX<=minWPX*1.05) scrollArea.scrollTop=0;
    else scrollArea.scrollTop=Math.max(0,(7*60-30)*WPX);
    // 時間軸列にドラッグ縮尺変更をバインド
    const tc=document.getElementById('weekTimeCol');
    if(tc)tc.addEventListener('mousedown',onWeekTimeColScaleStart);
  },50);

  // 日記セクション
  const diaryHTML=dates.map((dt,i)=>{
    const data=weekData[i];
    const diary=data.diary||'';
    const isT=(dt.y===todayY&&dt.m===todayM&&dt.d===todayD);
    const isLast=i===6;
    return `<div style="padding:8px 10px;min-height:80px;background:${isT?'#fffdf5':'#fff'};${isLast?'':'border-right:0.5px solid #ddd;'}border-top:0.5px solid #eee;vertical-align:top">
      <div style="font-size:11px;color:#aaa;margin-bottom:4px">${dt.m}/${dt.d}</div>
      <div style="font-size:11px;color:#444;line-height:1.6;white-space:pre-wrap;word-break:break-all">${diary?escapeHtml(diary):'<span style="color:#ddd">---</span>'}</div>
    </div>`;
  }).join('');
  document.getElementById('weekDiary').innerHTML=
    `<div style="background:#f5f5f2;border-right:0.5px solid #ddd;padding:8px 4px;display:flex;align-items:center;justify-content:center"><span style="font-size:10px;color:#888;writing-mode:horizontal-tb">📝</span></div>`+diaryHTML;

  // 学習チェックセクション
  const learningItems=getLearningItems();
  const weekLearningArea=document.getElementById('weekLearningArea');
  const weekLearningEl=document.getElementById('weekLearning');
  if(!learningItems.length){
    weekLearningArea.style.display='none';
  }else{
    weekLearningArea.style.display='block';
    const ROWS=3; // 1列あたり最大行数
    // アイテムをROWS行ずつのチャンクに分割
    const chunks=[];
    for(let i=0;i<learningItems.length;i+=ROWS)chunks.push(learningItems.slice(i,i+ROWS));

    // 週合計学習時間を計算（項目別）
    let weekTotalMin=0;
    const weekItemMin={}; // {tmplId: 分}
    learningItems.forEach(t=>{weekItemMin[t.id]=0;});
    // 各日の実績から学習項目名に一致する合計時間を計算するヘルパー
    function getDayActualMin(dayActuals,name){
      return (dayActuals||[]).filter(b=>(b.name||'').trim()===name.trim())
        .reduce((s,b)=>{const d=toMin(b.end)-toMin(b.start);return s+(d>0?d:0);},0);
    }

    const learningColHTML=dates.map((dt,i)=>{
      const data=weekData[i];
      const checks=data.learningChecks||{};
      const dayActuals=data.actuals||[];
      const isT=(dt.y===todayY&&dt.m===todayM&&dt.d===todayD);
      const isLast=i===6;
      const dtKey=`${dt.y}-${dt.m}-${dt.d}`;

      // 実績自動マッチング＋項目別集計
      const autoMin={};
      learningItems.forEach(t=>{
        const m=getDayActualMin(dayActuals,t.name);
        if(m>0){autoMin[t.id]=m;weekTotalMin+=m;weekItemMin[t.id]+=m;}
      });

      const done=learningItems.filter(t=>autoMin[t.id]||checks[t.id]).length;

      // チャンクを横並びにしてROWS行以内に収める
      const colsHTML=chunks.map(chunk=>{
        const rows=chunk.map(t=>{
          const isAuto=!!autoMin[t.id];
          const isManual=!!checks[t.id];
          const checked=isAuto||isManual;
          const minLabel=autoMin[t.id]?` <span style="font-size:9px;color:#3C3489;background:#EEEDFE;border-radius:3px;padding:0 4px">${fmtMin(autoMin[t.id])}</span>`:'';
          return `<div style="display:flex;align-items:center;gap:4px;padding:1px 0;white-space:nowrap">
            <input type="checkbox" ${checked?'checked':''} ${isAuto?'disabled':''}
              onchange="toggleWeekLearningCheck('${dtKey}',${t.id},this.checked)"
              style="width:12px;height:12px;cursor:${isAuto?'default':'pointer'};accent-color:#3C3489;flex-shrink:0">
            <span style="font-size:10px;color:${checked?'#bbb':'#444'};text-decoration:${checked?'line-through':'none'};overflow:hidden;text-overflow:ellipsis">${t.name}${minLabel}</span>
          </div>`;
        }).join('');
        return `<div style="flex-shrink:0;min-width:0">${rows}</div>`;
      }).join('');
      return `<div style="padding:6px 8px;background:${isT?'#fffdf5':'#fff'};${isLast?'':'border-right:0.5px solid #ddd;'}">
        <div style="font-size:10px;color:#aaa;margin-bottom:3px">${dt.m}/${dt.d}　<span style="color:${done===learningItems.length&&done>0?'#1D9E75':'#aaa'}">${done}/${learningItems.length}</span></div>
        <div style="display:flex;gap:10px;flex-wrap:nowrap;overflow:hidden">${colsHTML}</div>
      </div>`;
    }).join('');
    weekLearningEl.innerHTML=
      `<div style="background:#f5f5f2;border-right:0.5px solid #ddd;padding:8px 4px;display:flex;align-items:center;justify-content:center"><span style="font-size:10px;color:#888">📚</span></div>`+learningColHTML;

    // 週合計時間を項目別内訳付きで表示
    const weekTotalEl=document.getElementById('weekLearningTotal');
    if(weekTotalEl){
      if(weekTotalMin>0){
        // 項目別バッジ（時間があるものだけ）
        const itemBadges=learningItems
          .filter(t=>weekItemMin[t.id]>0)
          .map(t=>`<span style="display:inline-flex;align-items:center;gap:3px;background:#f5f5f2;border:0.5px solid #ddd;border-radius:4px;padding:1px 6px;font-size:11px;color:#444">
            <span style="color:#666">${t.name}</span>
            <span style="color:#3C3489;font-weight:500">${fmtMin(weekItemMin[t.id])}</span>
          </span>`).join('');
        weekTotalEl.innerHTML=
          `<span style="color:#085041;font-weight:500">週合計 ${fmtMin(weekTotalMin)}</span>`+
          `<span style="margin-left:8px;display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center">${itemBadges}</span>`;
        weekTotalEl.style.cssText='font-size:11px;background:#E1F5EE;border-radius:6px;padding:3px 10px;display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;margin-left:8px';
      }else{
        weekTotalEl.style.display='none';
      }
    }
  }
}
function toggleWeekLearningCheck(dtKey,tmplId,checked){
  // dtKey = "yyyy-m-d"
  const[y,m,d]=dtKey.split('-').map(Number);
  const storageKey='yojitsu:'+mkDateStr(y,m,d);
  let data={plans:[],actuals:[],nextId:200,diary:'',learningChecks:{}};
  try{const r=localStorage.getItem(storageKey);if(r)data=JSON.parse(r);}catch(e){}
  if(!data.learningChecks)data.learningChecks={};
  data.learningChecks[tmplId]=checked;
  try{localStorage.setItem(storageKey,JSON.stringify(data));}catch(e){}
  // 表示中の日と同じなら日次側も更新
  if(y===cY&&m===cM&&d===cD){
    learningChecks=data.learningChecks;
    renderLearningChecks();
  }
  renderWeek();
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function jumpToDay(y,m,d){cY=y;cM=m;cD=d;render._initialized=false;updateHeader();loadData();render();renderLearningChecks();showDaily();}

// ---- ダッシュボード ----
const ITEM_COLORS=['#378ADD','#1D9E75','#EF9F27','#7F77DD','#D85A30','#D4537E','#639922','#BA7517'];

function getDashPeriods(){
  const now=new Date();
  const periods=[];
  if(dashMode==='week'){
    for(let i=3;i>=0;i--){
      const sun=new Date(now);
      sun.setDate(sun.getDate()-sun.getDay()-i*7);
      const sat=new Date(sun);sat.setDate(sat.getDate()+6);
      const dates=[];
      for(let d=0;d<7;d++){const dd=new Date(sun);dd.setDate(dd.getDate()+d);dates.push({y:dd.getFullYear(),m:dd.getMonth()+1,d:dd.getDate()});}
      const label=`${sun.getMonth()+1}/${sun.getDate()}週`;
      periods.push({label,dates,isCurrent:i===0});
    }
  }else if(dashMode==='month'){
    for(let i=3;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      const dates=[];
      for(let dd=1;dd<=last;dd++)dates.push({y:d.getFullYear(),m:d.getMonth()+1,d:dd});
      periods.push({label:`${d.getMonth()+1}月`,dates,isCurrent:i===0});
    }
  }else{
    for(let i=2;i>=0;i--){
      const y=now.getFullYear()-i;
      const dates=[];
      for(let m=1;m<=12;m++){const last=new Date(y,m,0).getDate();for(let dd=1;dd<=last;dd++)dates.push({y,m,d:dd});}
      periods.push({label:`${y}年`,dates,isCurrent:i===0});
    }
  }
  return periods;
}

function getDayData(y,m,d){
  try{const r=localStorage.getItem('yojitsu:'+mkDateStr(y,m,d));if(r)return JSON.parse(r);}catch(e){}
  return null;
}

function renderDashboard(){
  const items=getLearningItems();
  const periods=getDashPeriods();
  const cur=periods[periods.length-1];

  // 期間ラベル
  const periodEl=document.getElementById('dashPeriodLabel');
  if(periodEl)periodEl.textContent=cur.label;

  // ボタンの見た目
  ['week','month','year'].forEach(m=>{
    const btn=document.getElementById('dashBtn'+m.charAt(0).toUpperCase()+m.slice(1));
    if(btn){
      if(m===dashMode){btn.style.background='#EEEDFE';btn.style.color='#3C3489';btn.style.borderColor='#AFA9EC';}
      else{btn.style.background='';btn.style.color='';btn.style.borderColor='';}
    }
  });

  // 当期のデータ集計
  let totalMin=0;
  const itemMins={};
  items.forEach(t=>{itemMins[t.id]=0;});
  cur.dates.forEach(({y,m,d})=>{
    const data=getDayData(y,m,d);
    if(!data||!data.actuals)return;
    items.forEach(t=>{
      data.actuals.filter(a=>(a.name||'').trim()===t.name.trim()).forEach(a=>{
        const dd=toMin(a.end)-toMin(a.start);
        if(dd>0){itemMins[t.id]+=dd;totalMin+=dd;}
      });
    });
  });

  // ① サマリー
  const statsEl=document.getElementById('dashStats');
  const studyDays=cur.dates.filter(({y,m,d})=>{
    const data=getDayData(y,m,d);
    if(!data||!data.actuals)return false;
    return items.some(t=>data.actuals.some(a=>(a.name||'').trim()===t.name.trim()&&toMin(a.end)-toMin(a.start)>0));
  }).length;
  const checkedItems=items.filter(t=>itemMins[t.id]>0).length;
  statsEl.innerHTML=`
    <div style="background:#f5f5f2;border-radius:8px;padding:8px 10px"><div style="font-size:18px;font-weight:500">${fmtMin(totalMin)||'0h'}</div><div style="font-size:10px;color:#666;margin-top:1px">${cur.label}の学習</div></div>
    <div style="background:#f5f5f2;border-radius:8px;padding:8px 10px"><div style="font-size:18px;font-weight:500">${checkedItems}</div><div style="font-size:10px;color:#666;margin-top:1px">学習項目数</div><div style="font-size:10px;color:#aaa;margin-top:2px">全${items.length}中</div></div>
    <div style="background:#f5f5f2;border-radius:8px;padding:8px 10px"><div style="font-size:18px;font-weight:500">${studyDays}日</div><div style="font-size:10px;color:#666;margin-top:1px">学習した日</div></div>
    <div style="background:#f5f5f2;border-radius:8px;padding:8px 10px"><div style="font-size:18px;font-weight:500">${fmtMin(totalMin)||'0h'}</div><div style="font-size:10px;color:#666;margin-top:1px">累計</div></div>`;

  // ① 棒グラフ
  const maxMin=Math.max(...items.map(t=>itemMins[t.id]),1);
  const barEl=document.getElementById('dashBarChart');
  barEl.innerHTML=items.filter(t=>itemMins[t.id]>0).map((t,i)=>`
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
      <div style="font-size:10px;color:#1a1a1a;width:90px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.name}</div>
      <div style="flex:1;height:10px;background:#f5f5f2;border-radius:2px;overflow:hidden">
        <div style="width:${Math.round(itemMins[t.id]/maxMin*100)}%;height:100%;background:${ITEM_COLORS[i%ITEM_COLORS.length]};border-radius:2px"></div>
      </div>
      <div style="font-size:10px;color:#666;width:32px;text-align:right">${fmtMin(itemMins[t.id])}</div>
    </div>`).join('')||'<div style="font-size:11px;color:#aaa">データなし</div>';

  // ② 積み上げ棒グラフ
  const stackEl=document.getElementById('dashStackChart');
  const legendEl=document.getElementById('dashStackLegend');
  const periodMins=periods.map(p=>{
    const mins={};
    items.forEach(t=>{mins[t.id]=0;});
    p.dates.forEach(({y,m,d})=>{
      const data=getDayData(y,m,d);
      if(!data||!data.actuals)return;
      items.forEach(t=>{
        data.actuals.filter(a=>(a.name||'').trim()===t.name.trim()).forEach(a=>{
          const dd=toMin(a.end)-toMin(a.start);if(dd>0)mins[t.id]+=dd;
        });
      });
    });
    const total=items.reduce((s,t)=>s+mins[t.id],0);
    return{...p,mins,total};
  });
  const maxTotal=Math.max(...periodMins.map(p=>p.total),1);
  stackEl.innerHTML=periodMins.map(p=>{
    const h=Math.round(p.total/maxTotal*80);
    const bars=items.filter(t=>p.mins[t.id]>0).map((t,i)=>{
      const bh=Math.round(p.mins[t.id]/maxTotal*80);
      return `<div style="width:100%;height:${bh}px;background:${ITEM_COLORS[items.indexOf(t)%ITEM_COLORS.length]}"></div>`;
    }).join('');
    return `<div style="flex:1;text-align:center">
      <div style="height:80px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:3px;${p.isCurrent?'border:0.5px solid #B5D4F4;border-radius:3px;padding:2px 2px 0':''}">${bars}</div>
      <div style="font-size:9px;color:${p.isCurrent?'#378ADD':'#666'}">${p.label}</div>
      <div style="font-size:10px;font-weight:500;color:${p.isCurrent?'#378ADD':'#1a1a1a'}">${fmtMin(p.total)||'—'}</div>
    </div>`;
  }).join('');
  legendEl.innerHTML=items.filter(t=>periodMins.some(p=>p.mins[t.id]>0)).map((t,i)=>`
    <div style="display:flex;align-items:center;gap:3px">
      <div style="width:8px;height:8px;background:${ITEM_COLORS[i%ITEM_COLORS.length]};border-radius:1px"></div>
      <span style="font-size:9px;color:#666">${t.name}</span>
    </div>`).join('');

  // ③ カレンダー
  const calEl=document.getElementById('dashCalendar');
  const dows=['日','月','火','水','木','金','土'];
  let calHTML=`<div style="display:grid;grid-template-columns:36px repeat(7,1fr);gap:2px;margin-bottom:3px"><div></div>${dows.map(d=>`<div style="font-size:9px;color:#aaa;text-align:center">${d}</div>`).join('')}</div>`;
  // 当月のカレンダー（週モードは当月、月モードは当月、年モードは今年の月別）
  if(dashMode==='year'){
    const y=new Date().getFullYear();
    const monthTotals=[];
    for(let mo=1;mo<=12;mo++){
      const last=new Date(y,mo,0).getDate();
      let tot=0;
      for(let dd=1;dd<=last;dd++){
        const data=getDayData(y,mo,dd);
        if(!data||!data.actuals)continue;
        items.forEach(t=>{data.actuals.filter(a=>(a.name||'').trim()===t.name.trim()).forEach(a=>{const d2=toMin(a.end)-toMin(a.start);if(d2>0)tot+=d2;});});
      }
      monthTotals.push({mo,tot});
    }
    const maxT=Math.max(...monthTotals.map(m=>m.tot),1);
    calHTML=`<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px">` +
      monthTotals.map(({mo,tot})=>{
        const bg=tot===0?'#f5f5f2':tot<maxT*0.3?'#E6F1FB':tot<maxT*0.6?'#B5D4F4':'#378ADD';
        const fc=tot<maxT*0.6?'#0C447C':'#fff';
        return `<div style="text-align:center;background:${bg};border-radius:4px;padding:4px 2px"><div style="font-size:10px;color:#666">${mo}月</div><div style="font-size:9px;font-weight:500;color:${fc}">${tot?fmtMin(tot):'—'}</div></div>`;
      }).join('') + '</div>';
  }else{
    const d=new Date();
    const y=d.getFullYear(),mo=d.getMonth()+1;
    const first=new Date(y,mo-1,1).getDay();
    const last=new Date(y,mo,0).getDate();
    const cells=[];
    for(let i=0;i<first;i++)cells.push(null);
    for(let dd=1;dd<=last;dd++)cells.push({y,m:mo,d:dd});
    while(cells.length%7)cells.push(null);
    const weeks=[];
    for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));
    calHTML+=weeks.map(week=>{
      const label=week.find(c=>c)?`${week.find(c=>c).m}/${week.find(c=>c).d}`:'';
      return `<div style="display:grid;grid-template-columns:36px repeat(7,1fr);gap:2px;margin-bottom:2px">
        <div style="font-size:9px;color:#aaa;display:flex;align-items:center;justify-content:flex-end;padding-right:3px">${label}</div>
        ${week.map(cell=>{
          if(!cell)return`<div style="height:20px;background:#f9f9f9;border-radius:2px"></div>`;
          const data=getDayData(cell.y,cell.m,cell.d);
          let tot=0;
          if(data&&data.actuals)items.forEach(t=>{data.actuals.filter(a=>(a.name||'').trim()===t.name.trim()).forEach(a=>{const dd=toMin(a.end)-toMin(a.start);if(dd>0)tot+=dd;});});
          const bg=tot===0?'#f5f5f2':tot<120?'#E6F1FB':tot<240?'#B5D4F4':'#378ADD';
          const fc=tot<240?'#0C447C':'#fff';
          return`<div style="height:20px;background:${bg};border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:500;color:${fc}">${tot?fmtMin(tot):'—'}</div>`;
        }).join('')}
      </div>`;

function copyText(){

  plans.forEach(p=>txt+=`  ${p.start}〜${p.end}（${toH(dur(p.start,p.end))}）${p.name}\n`);
  txt+='\n▼実績\n';
  actuals.forEach(a=>{
    const pl=mPlan(a);const d=pl?dur(a.start,a.end)-dur(pl.start,pl.end):0;
    txt+=`  ${a.start}〜${a.end}（${toH(dur(a.start,a.end))}）${a.name}`;
    if(pl&&Math.abs(d)>5)txt+=`  ★${d>0?'+':''}${d}分`;
    txt+='\n';
  });
  navigator.clipboard.writeText(txt).then(()=>alert('コピーしました'));
}

// ---- カレンダーピッカー ----
let calY=0,calM=0,calWeekMode=false;
const CAL_DOWS=['日','月','火','水','木','金','土'];

function toggleCalPicker(){
  const popup=document.getElementById('calPopup');
  if(popup.classList.contains('open')&&!calWeekMode){closeCalPicker();return;}
  calWeekMode=false;
  calY=cY;calM=cM;
  renderCalPopup();
  const anchor=document.getElementById('dateDisplay');
  const r=anchor.getBoundingClientRect();
  popup.style.top=(r.bottom+4)+'px';
  popup.style.left=r.left+'px';
  popup.classList.add('open');
}
function toggleCalPickerWeek(){
  const popup=document.getElementById('calPopup');
  if(popup.classList.contains('open')&&calWeekMode){closeCalPicker();return;}
  calWeekMode=true;
  calY=weekSunDate.y;calM=weekSunDate.m;
  renderCalPopup();
  const anchor=document.getElementById('weekTitle');
  const r=anchor.getBoundingClientRect();
  popup.style.top=(r.bottom+4)+'px';
  popup.style.left=r.left+'px';
  popup.classList.add('open');
}
function closeCalPicker(){
  document.getElementById('calPopup').classList.remove('open');
}
function calChangeMonth(n){
  calM+=n;
  if(calM>12){calM=1;calY++;}
  if(calM<1){calM=12;calY--;}
  renderCalPopup();
}
function renderCalPopup(){
  document.getElementById('calTitle').textContent=`${calY}年 ${calM}月`;
  // 曜日ヘッダー
  document.getElementById('calDowRow').innerHTML=CAL_DOWS.map((d,i)=>
    `<div class="cal-dow" style="${i===0?'color:#993C1D':i===6?'color:#0C447C':''}">${d}</div>`
  ).join('');
  // 日グリッド
  const firstDow=new Date(calY,calM-1,1).getDay();
  const lastDay=new Date(calY,calM,0).getDate();
  const prevLast=new Date(calY,calM-1,0).getDate();
  let cells='';
  // 前月の余白
  for(let i=0;i<firstDow;i++){
    const d=prevLast-firstDow+1+i;
    cells+=`<div class="cal-day other-month">${d}</div>`;
  }
  // 当月
  for(let d=1;d<=lastDay;d++){
    const isToday=(calY===todayY&&calM===todayM&&d===todayD);
    // 週次モード：その週全体をハイライト、日次モード：選択日をハイライト
    let isSel=false;
    if(calWeekMode){
      const dt=new Date(calY,calM-1,d);
      const sun=new Date(weekSunDate.y,weekSunDate.m-1,weekSunDate.d);
      const sat=new Date(sun);sat.setDate(sat.getDate()+6);
      isSel=(dt>=sun&&dt<=sat);
    }else{
      isSel=(calY===cY&&calM===cM&&d===cD);
    }
    const dow=new Date(calY,calM-1,d).getDay();
    const holiday=getHoliday(calY,calM,d);
    const isRed=dow===0||!!holiday;
    const isSat=dow===6;
    let cls='cal-day';
    if(isSel)cls+=' selected';
    else if(isToday)cls+=' today';
    else if(isRed)cls+=' holiday';
    else if(isSat)cls+=' sat';
    const title=holiday?holiday:'';
    cells+=`<div class="${cls}" title="${title}" onclick="calJumpToDay(${calY},${calM},${d})">${d}</div>`;
  }
  // 翌月の余白（6行分になるよう埋める）
  const total=firstDow+lastDay;
  const remain=total%7===0?0:7-(total%7);
  for(let d=1;d<=remain;d++){
    cells+=`<div class="cal-day other-month">${d}</div>`;
  }
  document.getElementById('calDayGrid').innerHTML=cells;
}
function calJumpToDay(y,m,d){
  closeCalPicker();
  if(calWeekMode){
    // クリックした日が含まれる週の日曜にジャンプ
    const clicked=new Date(y,m-1,d);
    clicked.setDate(clicked.getDate()-clicked.getDay());
    weekSunDate={y:clicked.getFullYear(),m:clicked.getMonth()+1,d:clicked.getDate()};
    renderWeek();
  }else{
    cY=y;cM=m;cD=d;
    render._initialized=false;
    updateHeader();loadData();render();renderLearningChecks();
  }
}

// ---- サイドバーリサイズ ----
(function(){
  const resizer=document.getElementById('sidebarResizer');
  let startX=0,startW=0;
  const MIN_W=80,MAX_W=400;

  const saved=localStorage.getItem('yojitsu:sidebarW');
  if(saved){
    const w=parseInt(saved);
    if(w>=MIN_W&&w<=MAX_W)document.documentElement.style.setProperty('--sidebar-w',w+'px');
  }

  resizer.addEventListener('mousedown',e=>{
    e.preventDefault();
    window._sbDragging=true;
    startX=e.clientX;
    startW=document.getElementById('sidebar').getBoundingClientRect().width;
    resizer.classList.add('dragging');
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
  });
  document.addEventListener('mousemove',e=>{
    if(!window._sbDragging)return;
    const w=Math.max(MIN_W,Math.min(MAX_W,startW+(e.clientX-startX)));
    document.documentElement.style.setProperty('--sidebar-w',w+'px');
  });
  document.addEventListener('mouseup',e=>{
    if(!window._sbDragging)return;
    window._sbDragging=false;
    resizer.classList.remove('dragging');
    document.body.style.cursor='';
    document.body.style.userSelect='';
    const w=document.getElementById('sidebar').getBoundingClientRect().width;
    localStorage.setItem('yojitsu:sidebarW',Math.round(w));
  });
})();

// ---- タイムライン縦リサイズ ----
(function(){
  const resizer=document.getElementById('tlVResizer');
  const scroll=document.getElementById('tlScroll');
  const sidebar=document.getElementById('sidebar');
  let startY=0,startH=0;
  const MIN_H=150;

  const saved=localStorage.getItem('yojitsu:tlH');
  const defaultH=Math.max(MIN_H,window.innerHeight-110-200-20);
  const savedH=saved?Math.max(MIN_H,parseInt(saved)):defaultH;
  // defaultHを優先（画面サイズに合わせて最大限広げる）
  const initH=Math.max(defaultH, Math.min(savedH,defaultH));
  document.documentElement.style.setProperty('--tl-h',initH+'px');
  if(sidebar)sidebar.style.height=initH+'px';

  // ドラッグ中の最大高さ：リサイザー自体＋日記エリア最低高さ＋余白を確保
  function calcMaxH(){
    const tlOuter=scroll.closest('.tl-outer');
    const outerTop=tlOuter?tlOuter.getBoundingClientRect().top:0;
    const DIARY_MIN=60; // 日記エリアの最低確保高さ
    const RESIZER_H=18;  // .tl-v-resizerの高さ
    const MARGIN=16;     // 下の余白
    return Math.max(MIN_H, window.innerHeight - outerTop - RESIZER_H - DIARY_MIN - MARGIN);
  }

  resizer.addEventListener('mousedown',e=>{
    e.preventDefault();
    window._tlVDragging=true;
    startY=e.clientY;
    startH=scroll.getBoundingClientRect().height;
    resizer.classList.add('dragging');
    document.body.style.cursor='ns-resize';
    document.body.style.userSelect='none';
  });
  document.addEventListener('mousemove',e=>{
    if(!window._tlVDragging)return;
    const h=Math.max(MIN_H,Math.min(calcMaxH(),startH+(e.clientY-startY)));
    document.documentElement.style.setProperty('--tl-h',h+'px');
    if(sidebar)sidebar.style.height=h+'px';
  });
  document.addEventListener('mouseup',e=>{
    if(!window._tlVDragging)return;
    window._tlVDragging=false;
    resizer.classList.remove('dragging');
    document.body.style.cursor='';
    document.body.style.userSelect='';
    const h=scroll.getBoundingClientRect().height;
    localStorage.setItem('yojitsu:tlH',Math.round(h));
  });
})();

// ---- Firebase版 loadData ----
function loadData(y,m,d){
  const ds = y ? mkDateStr(y,m,d) : dateStr();
  const key = 'yojitsu:' + ds;
  if (!currentUid) {
    // 未ログイン時はlocalStorageから
    try {
      const raw = localStorage.getItem(key);
      if (raw) {
        const data = JSON.parse(raw);
        data.plans=(data.plans||[]).filter(p=>!p.carryId);
        data.actuals=(data.actuals||[]).filter(a=>!a.carryId);
        if (!y) { plans=data.plans;actuals=data.actuals;nextId=data.nextId||200;learningChecks=data.learningChecks||{}; const ta=document.getElementById('diaryText');if(ta)ta.value=data.diary||''; }
        return data;
      }
    } catch(e){}
    if (!y) { plans=[];actuals=[];nextId=200;learningChecks={}; }
    return null;
  }
  // Firebase から読み込み
  db.ref('users/'+currentUid+'/days/'+ds).once('value').then(snap => {
    const data = snap.val();
    if (data) {
      data.plans=(data.plans||[]).filter(p=>!p.carryId);
      data.actuals=(data.actuals||[]).filter(a=>!a.carryId);
      if (!y) {
        plans=data.plans;actuals=data.actuals;nextId=data.nextId||200;
        learningChecks=data.learningChecks||{};
        const ta=document.getElementById('diaryText');
        if(ta)ta.value=data.diary||'';
        setDiaryStatus('');
      }
      // localStorageにも保存
      try { localStorage.setItem(key, JSON.stringify(data)); } catch(e){}
    } else {
      if (!y) { plans=[];actuals=[];nextId=200;learningChecks={}; const ta=document.getElementById('diaryText');if(ta)ta.value=''; setDiaryStatus(''); }
    }
    render();renderLearningChecks();
  });
  return null;
}

// ---- Firebase版 loadTemplates ----
function loadTemplatesFromFirebase(callback){
  if (!currentUid) { loadTemplates(); if(callback)callback(); return; }
  db.ref('users/'+currentUid+'/templates').once('value').then(snap => {
    const data = snap.val();
    if (data && Array.isArray(data) && data.length) {
      templates = data;
    } else {
      loadTemplates(); // デフォルトテンプレートをセット
    }
    renderTemplates();
    if(callback)callback();
  });
}
